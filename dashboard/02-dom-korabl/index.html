<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050b13">
<title>Maison Sauvage. Дом-корабль</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..700&family=Tektur:wdth,wght@75..100,400..900&display=swap" rel="preload" as="style" onload="this.rel='stylesheet'">
<style>
:root{
  --bg:#050b13;--bg2:#08131f;--ice:#def2ff;--soft:rgba(222,242,255,.84);--line:rgba(150,212,248,.42);--line2:rgba(150,212,248,.2);
  --hot:#ff6a13;--hot2:#ffa566;--f:'Tektur',sans-serif;--m:'Martian Mono',monospace;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ice);font-family:var(--m);font-stretch:75%;font-size:12px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;min-height:100dvh}
button{all:unset;box-sizing:border-box;cursor:pointer;font:inherit;color:inherit;display:block}
button:focus-visible{outline:2px solid var(--hot2);outline-offset:2px}
b{font-weight:600}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#gl.drag{cursor:grabbing}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to top,rgba(5,11,19,.96) 0,rgba(5,11,19,.82) 52%,rgba(5,11,19,0) 100%);pointer-events:none;z-index:0}
#sheet{z-index:1}
#lead{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .35s}
#lead path{fill:none;stroke:var(--line);stroke-width:1}
#lead circle{fill:var(--bg);stroke:var(--ice);stroke-width:1}
#lead .nod{display:none}
#lead .hot path,#lead path.hot{stroke:var(--hot2)}
#lead circle.hot{stroke:var(--hot2)}

/* Лист чертежа */
.ruler{position:fixed;left:14px;right:14px;top:10px;height:17px;pointer-events:none;border-bottom:1px solid var(--line2)}
.ruler i{position:absolute;bottom:0;width:1px;height:5px;background:var(--line)}
.ruler i.t{height:8px;background:var(--ice)}
.ruler i.now{height:12px;width:3px;margin-left:-1px;background:var(--hot)}
.ruler span{position:absolute;top:-1px;transform:translateX(-50%);font-size:11px;line-height:1;color:var(--soft)}
.sheet-edge{position:fixed;inset:10px 14px 10px 14px;border:1px solid var(--line2);pointer-events:none}

#sheet{position:fixed;inset:0;pointer-events:none;display:grid;padding:36px 34px 24px 34px;
  grid-template-columns:352px 1fr 330px;grid-template-rows:auto 1fr auto;column-gap:22px;row-gap:10px;transition:opacity .4s}
#sheet>*,.hero>*,.below>*{pointer-events:auto}
.hero,.below{display:contents}
body.fly #sheet,body.fly #lead,body.fly .ruler,body.fly .sheet-edge,body.fly .hs,body.fly .tag,body.fly .ms-nav,body.fly::after{opacity:0!important;pointer-events:none;transition:opacity .25s}
body.fly #sheet>*,body.fly .hero>*,body.fly .below>*{pointer-events:none}
.ms-nav{transition:opacity .4s}

.k{font-size:11px;line-height:1.25;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:500}
.k{color:var(--ice)}
.k i{font-style:normal;color:var(--soft);text-transform:none;letter-spacing:.02em;font-weight:400}
.s{font-size:12px;color:var(--soft)}

/* A и B */
.lead-col{grid-column:1;grid-row:1;align-self:start;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.lead-col>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font:700 17px/1 var(--f);letter-spacing:.2em}
.brand span{font-size:11px;color:var(--soft)}
.a-top{display:flex;justify-content:space-between;gap:12px}
.a-num{display:flex;align-items:baseline;gap:12px;margin-top:-6px}
.a-num b{font:600 clamp(92px,12.6vh,124px)/.98 var(--f);letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(5,11,19,.9)}
.a-num .u{font:500 25px/1 var(--f);color:var(--ice)}
.a-sub{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-top:2px}
.a-sub .usd{font:500 25px/1 var(--f)}
.a-sub .fc{font-size:12px;color:var(--soft)}
.a-sub .fc b{color:var(--ice);font-size:13px}
.b{border-top:1px solid var(--line);padding-top:9px;margin-top:4px}
.b-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.b-name{font:600 22px/1.1 var(--f);margin-top:2px}
.b-left{font:600 22px/1.1 var(--f);color:var(--hot2);white-space:nowrap;margin-top:2px}
.segs{display:flex;gap:2px;height:13px;margin:8px 0 6px}
.segs i{flex:1 1 0;min-width:1px;background:rgba(150,212,248,.22)}
.segs i.on{background:var(--hot)}
.segs.ice i.on{background:var(--ice)}
.segs i.head{background:#ffe7d3;box-shadow:0 0 8px var(--hot)}
.segs.tall{height:18px}
.b-bot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--soft)}

/* Находка дня */
.ant{grid-column:2;grid-row:1;justify-self:center;align-self:start;max-width:520px;min-height:44px;padding:0 4px;text-align:center}
.ant .ins{display:block;font:500 15.5px/1.3 var(--f);color:var(--ice);margin-top:4px;text-wrap:balance}
.ant .more{display:inline-block;margin-top:4px;font-size:11px;color:var(--hot2);border-bottom:1px solid currentColor}

/* Задачи */
.tasks{grid-column:3;grid-row:1;align-self:start}
.tasks h2{margin-bottom:4px}
.task{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;min-height:46px;width:100%;padding:6px 2px;border-top:1px solid var(--line2);position:relative;overflow:hidden}
.task .box{width:24px;height:24px;border:1.5px solid var(--ice);position:relative;transition:background .2s}
.task .txt{font:500 13.5px/1.22 var(--f);color:var(--ice)}
.task em{display:block;font-style:normal;font-size:11px;color:var(--soft);margin-top:1px}
.task[aria-checked=true] .box{background:var(--hot);border-color:var(--hot)}
.task[aria-checked=true] .box::after{content:"";position:absolute;left:7px;top:2px;width:7px;height:13px;border:solid #081018;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.task[aria-checked=true] .txt{color:var(--soft)}
.task::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,130,50,.5),transparent);transform:translateX(-101%);pointer-events:none}
.task.go::after{animation:sw .6s ease-out}
@keyframes sw{to{transform:translateX(101%)}}

/* Выноски */
.co-col{display:flex;flex-direction:column;justify-content:center;gap:26px;pointer-events:none}
.co-l{grid-column:1;grid-row:2;align-items:flex-start;justify-content:flex-start;padding-top:14px}
.co-r{grid-column:3;grid-row:2;align-items:flex-end;justify-content:flex-start;padding-top:20px}
.co{pointer-events:auto;min-height:44px;max-width:210px;padding:3px 0;position:relative}
.co-r .co{min-width:210px}
.co,.eng{text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
.co .k{display:block}
.co .n{display:block;font:600 34px/1.05 var(--f);margin-top:1px}
.co .n small{font:500 16px/1 var(--f)}
.co .s{display:block;font-size:11.5px;line-height:1.3}
.co .s b{color:var(--ice)}
.co:hover .n,.co.sel .n{color:var(--hot2)}
.co .lever{color:var(--ice);border-left:2px solid var(--hot);padding-left:7px;margin-top:4px}

/* Нижняя полоса */
.bottom{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:minmax(240px,300px) 1fr minmax(350px,27vw);gap:22px;align-items:end}
.marks{align-self:end;margin-bottom:56px;min-height:44px;text-align:left}
.marks .row{display:flex;gap:3px;margin:6px 0 4px}
.marks .row i{width:11px;height:24px;background:var(--ice)}
.marks .row i.off{background:none;border:1px dashed var(--ice);opacity:.8}
.marks .row i.fresh{background:var(--hot)}
.marks .n{font:600 20px/1 var(--f)}
.marks:hover .n{color:var(--hot2)}
.mid{min-width:0;display:flex;flex-direction:column;gap:10px}
.eng3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
.eng{min-height:44px;min-width:0}
.eng .n{display:block;font:600 27px/1.08 var(--f);margin-top:1px;white-space:nowrap}
.eng .n small{font:500 14px/1 var(--f)}
.eng .segs{margin:4px 0 3px;height:8px}
.eng:hover .n{color:var(--hot2)}
.log{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;min-width:0}
.chart-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.chart-h .k{white-space:nowrap}
.chart-h .s{font-size:11px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{position:relative;display:flex;align-items:flex-end;gap:2px;height:64px;border-bottom:1px solid var(--line);touch-action:none}
.bars .c{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative;cursor:crosshair}
.bars .c i{display:block;width:100%;background:var(--ice)}
.bars .c.z i{height:3px!important;background:rgba(150,212,248,.55)}
.bars .c.f i{height:100%!important;background:none;border:1px dashed var(--line)}
.bars .c.me i{background:var(--hot)}
.bars .c:hover i{background:var(--hot2)}
.bars .g{position:absolute;left:0;right:0;border-top:1px dashed var(--hot2);pointer-events:none}
.bars .gl{position:absolute;left:0;font-size:11px;line-height:1;color:var(--ice);background:var(--bg);padding:0 4px 0 0;pointer-events:none}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-top:3px;white-space:nowrap}
.ax.m{display:flex;gap:2px;justify-content:flex-start}
.ax.m span{flex:1 1 0;text-align:center;min-width:0;overflow:hidden;font-size:11px;letter-spacing:-.02em}

/* Штамп чертежа: последний отчёт */
.stamp{border:1px solid var(--line);background:rgba(5,11,19,.86);display:grid;grid-template-columns:1.5fr .8fr .8fr 104px;font-size:11px;margin-bottom:0}
.stamp>div,.stamp>button{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 8px;min-width:0}
.st-h{grid-column:1/4}
.st-h b{display:block;font:600 19px/1.15 var(--f)}
.st-v b{display:block;font:600 22px/1.1 var(--f);white-space:nowrap}
.st-v b small{font:500 12px/1 var(--f)}
.st-vis{grid-column:1/4;border-bottom:0!important;color:var(--ice);font-size:12px;line-height:1.3}
.st-leg{grid-column:1/4;color:var(--soft);font-size:11px;line-height:1.35}
.st-go{grid-column:4;grid-row:1/5;border:0!important;text-align:center;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 6px!important;background:
  repeating-linear-gradient(135deg,var(--hot) 0 7px,#0b1420 7px 14px) top/100% 9px no-repeat,
  repeating-linear-gradient(135deg,var(--hot) 0 7px,#0b1420 7px 14px) bottom/100% 9px no-repeat,rgba(255,106,19,.12);font:600 13px/1.15 var(--f);letter-spacing:.02em;color:var(--ice)}
.st-go:hover{background-color:rgba(255,106,19,.34)}

/* Точки на модели */
.hs{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:3;will-change:transform;transition:opacity .3s}
.hs::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;background:var(--bg);border:1.5px solid var(--ice);transform:rotate(45deg)}
.hs:hover::before,.hs.sel::before{background:var(--hot);border-color:#ffe7d3}
.tag{position:fixed;left:0;top:0;z-index:2;font-size:11px;line-height:1.15;color:var(--ice);pointer-events:none;white-space:nowrap;will-change:transform;text-shadow:0 0 4px var(--bg),0 0 2px var(--bg)}
.tag.hot{font:600 12px/1.1 var(--f);color:var(--hot2)}

/* Панель отсека */
#panel{position:fixed;z-index:5;right:24px;top:36px;bottom:24px;width:min(424px,calc(100vw - 48px));background:rgba(5,11,19,.95);border:1px solid var(--line);padding:18px 20px 16px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .42s cubic-bezier(.2,.8,.2,1);visibility:hidden;overscroll-behavior:contain}
#panel.on{transform:none;visibility:visible}
#panel .x{position:absolute;right:8px;top:6px;min-width:44px;height:44px;line-height:44px;text-align:center;padding:0 8px;font-size:11px;color:var(--soft)}
#panel .x:hover{color:var(--hot2)}
.p-k{padding-right:64px}
.p-big{font:600 62px/1.04 var(--f);margin:6px 0 2px}
.p-big small{font:500 22px/1 var(--f)}
.p-t{font:500 16px/1.3 var(--f);color:var(--ice);margin:4px 0 12px;text-wrap:pretty}
.p-s{border-top:1px solid var(--line2);padding-top:10px;margin-top:12px}
.p-s h3{font:500 11px/1.25 var(--m);letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.rw{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 0;font-size:12px;color:var(--soft)}
.rw b{font:600 16px/1.15 var(--f);color:var(--ice);white-space:nowrap}
.rw .bar{flex:1;height:7px;align-self:center;background:rgba(150,212,248,.16);position:relative}
.rw .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ice)}
.en-r{padding:7px 0;border-bottom:1px solid var(--line2)}
.en-r .segs{height:11px;margin:5px 0 4px}
.en-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.en-top b{font:600 25px/1.1 var(--f)}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin:6px 0}
.dots i{aspect-ratio:1;border:1px solid var(--line);display:block;cursor:crosshair}
.dots i.on{background:var(--hot);border-color:var(--hot)}
.btn{display:inline-block;min-height:44px;line-height:42px;padding:0 16px;border:1px solid var(--hot2);font:600 13px/42px var(--f);color:var(--ice)}
.btn:hover{background:rgba(255,106,19,.2)}
.plates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{position:relative;padding:8px 9px 7px;min-height:88px;background:linear-gradient(160deg,rgba(150,212,248,.14),rgba(150,212,248,.04));clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);display:grid;grid-template-columns:1fr 32px;gap:2px 6px}
.pl .t{font-size:11px;line-height:1.2;color:var(--soft);grid-column:1}
.pl .v{font:600 18px/1.1 var(--f);color:var(--ice);grid-column:1;white-space:nowrap}
.pl .d{font-size:11px;line-height:1.2;color:var(--soft);grid-column:1/-1}
.pl svg{grid-column:2;grid-row:1/3;width:32px;height:32px;fill:none;stroke:var(--ice);stroke-width:1.5}
.pl.off{background:repeating-linear-gradient(135deg,rgba(150,212,248,.1) 0 2px,transparent 2px 7px);outline:1px dashed var(--line);outline-offset:-1px;clip-path:none}
.pl.off svg{stroke:var(--soft)}
.pl .pg{grid-column:1/-1;height:6px;background:rgba(150,212,248,.18);margin-top:3px}
.pl .pg i{display:block;height:100%;background:var(--hot)}
.pl.fresh{background:linear-gradient(160deg,rgba(255,106,19,.42),rgba(255,106,19,.1))}

/* Подсказка */
#tip{position:fixed;z-index:9;left:0;top:0;pointer-events:none;background:#0a1826;border:1px solid var(--line);padding:5px 8px;font-size:11.5px;line-height:1.3;color:var(--ice);opacity:0;transition:opacity .12s;white-space:nowrap}
#tip b{font:600 14px/1.1 var(--f);display:block}
#tip.on{opacity:1}

/* Победа */
#win{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#win.on{display:block;pointer-events:auto;cursor:pointer}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,#fff 0,#ffd9b8 28%,#ff7a24 62%,#ff6a13 100%);opacity:0}
.w-pre{position:absolute;left:0;right:0;top:10vh;text-align:center;opacity:0;transition:opacity .5s}
.w-pre b{display:block;font:500 clamp(28px,4.4vh,40px)/1.1 var(--f);letter-spacing:.34em;margin-right:-.34em}
.w-lamps{display:flex;justify-content:center;gap:14px;margin-top:14px}
.w-lamps i{width:44px;height:6px;background:rgba(150,212,248,.26);transition:background .1s}
.w-lamps i.on{background:var(--hot);box-shadow:0 0 12px var(--hot)}
.w-num{position:absolute;left:0;right:0;top:7vh;text-align:center;font:600 clamp(70px,14vh,128px)/1 var(--f);opacity:0;transition:opacity .4s;text-shadow:0 0 40px rgba(5,11,19,.9)}
.w-num small{font:500 .28em/1 var(--f)}
.w-post{position:absolute;left:0;right:0;top:calc(4.5vh + var(--safe-t));text-align:center;opacity:0;transition:opacity .8s}
.w-post.on{opacity:1;transform:none}
.w-post h2{font:700 clamp(44px,7.6vh,70px)/1.04 var(--f);letter-spacing:.01em;text-shadow:0 0 30px var(--bg)}
.w-post p{font:500 19px/1.3 var(--f);color:var(--ice);margin-top:6px;text-shadow:0 0 12px var(--bg)}
.w-post .nx{display:inline-block;margin-top:10px;font-size:13px;color:var(--ice);border-left:3px solid var(--hot);padding:2px 0 2px 9px;text-align:left;background:rgba(5,11,19,.6)}
.w-post .cl{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b));font-size:11px;color:var(--ice);text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}

.inline,.chips{display:none}

/* Телефон */
@media (max-width:820px){
  body{overflow:auto;overflow-x:hidden}
  #gl{position:absolute;top:0;left:0;height:100dvh}
  #lead,.ruler,.sheet-edge,.co-col,.marks.top{display:none}
  #sheet{position:relative;inset:auto;display:block;padding:0;pointer-events:none}
  .hero{position:relative;display:flex;flex-direction:column;min-height:100dvh;padding:calc(12px + var(--safe-t)) 18px 0;pointer-events:none}
  body::after{display:none}
  .hs{display:none}
  .below{display:block;background:var(--bg);padding:6px 18px calc(84px + var(--safe-b));position:relative;z-index:2;pointer-events:auto}
  .lead-col{gap:6px;transition:opacity .3s}
  .brand b{font-size:14px}
  .brand span{display:none}
  .a-num{margin-top:0}
  .a-num b{font-size:88px}
  .a-num .u{font-size:21px}
  .a-sub{gap:12px}
  .a-sub .usd{font-size:21px}
  .b{margin-top:4px;padding-top:7px}
  .b-name,.b-left{font-size:20px}
  .segs{margin:6px 0 4px}
  .chips{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;position:absolute;left:8px;right:8px;bottom:calc(60px + var(--safe-b));pointer-events:auto}
  .chips button{min-height:48px;padding:6px 0;background:rgba(5,11,19,.86);border:1px solid var(--line);font-size:11px;line-height:1.2;white-space:nowrap;min-width:0;overflow:hidden;text-align:center;letter-spacing:-.02em}
  .chips button b{display:block;font:600 15px/1.2 var(--f);letter-spacing:0}
  .ant,.tasks,.bottom,.mid,.log,.stamp,.eng3{display:block}
  .ant{max-width:none;text-align:left;margin:0;padding:12px 0;border-top:1px solid var(--line2)}
  .sec{padding:14px 0 12px;border-top:1px solid var(--line2)}
  .stamp{display:grid;grid-template-columns:1fr 1fr 1fr;margin:0 0 14px}
  .st-go{display:none!important}
  .st-h,.st-vis,.st-leg{grid-column:1/-1}
  .tasks{margin-bottom:6px}
  .task{min-height:56px}
  .eng3{display:grid;grid-template-columns:1fr;gap:12px}
  .eng .n{font-size:30px}
  .eng .segs{height:10px}
  .inline{display:block}
  .log{display:block}
  .log>div{margin-bottom:14px}
  .bars{height:90px}
  .marks{margin:0;padding:14px 0;border-top:1px solid var(--line2);width:100%;display:block}
  .marks.top{display:none}
  .win-big{display:block!important;width:100%;min-height:56px;margin-top:14px;text-align:center;font:600 16px/56px var(--f);background:
   repeating-linear-gradient(135deg,var(--hot) 0 7px,#0b1420 7px 14px) top/100% 7px no-repeat,
   repeating-linear-gradient(135deg,var(--hot) 0 7px,#0b1420 7px 14px) bottom/100% 7px no-repeat,rgba(255,106,19,.14)}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58dvh;padding:16px 18px calc(74px + var(--safe-b));transform:translateY(102%);border-width:1px 0 0}
  .p-big{font-size:48px}
  body.open .lead-col{opacity:0;pointer-events:none}
  .ant .ins{font-size:17px}
}
.win-big{display:none}
@media (min-width:821px) and (max-height:760px){
  .a-num b{font-size:80px}.co .n{font-size:26px}.co-col{gap:12px}.bars{height:44px}.st-leg{display:none}
}

</head>
<body>
<canvas id="gl" aria-label="Трёхмерная модель магазина на Бумбак 169. Перетаскивание вращает её."></canvas>
<svg id="lead" aria-hidden="true"></svg>
<div class="sheet-edge" aria-hidden="true"></div>
<div class="ruler" id="ruler" aria-hidden="true"></div>

<main id="sheet">
  <div class="hero">
    <div class="lead-col" id="lc">
      <div class="brand"><b>MAISON SAUVAGE</b><span id="addr"></span></div>
      <section class="a" aria-label="Выручка месяца">
        <div class="a-top"><span class="k">Выручка месяца</span><span class="k" id="dayOf"></span></div>
        <div class="a-num"><b id="revN">0</b><span class="u">млн&nbsp;Rp</span></div>
        <div class="a-sub"><span class="usd" id="revU"></span><span class="fc">Прогноз на месяц <b id="fc"></b></span></div>
      </section>
      <section class="b" aria-label="Следующая цель">
        <div class="b-top"><div><span class="k">Следующая цель</span><div class="b-name" id="gName"></div></div>
        <div style="text-align:right"><span class="k">Осталось</span><div class="b-left" id="gLeft"></div></div></div>
        <div class="segs" id="gSegs" role="img"></div>
        <div class="b-bot"><span id="gNote"></span><span id="gPct"></span></div>
      </section>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="below">
    <section class="stamp" aria-label="Последний отчёт" id="stamp"></section>
    <section class="tasks sec" aria-label="Сегодня сделать"><h2 class="k">Сегодня сделать</h2><div id="taskList"></div></section>
    <button class="ant" id="ant"><span class="k">Находка дня <i>антенна</i></span><span class="ins" id="ins"></span><span class="more">Следующая находка</span></button>
    <div class="co-col co-l" id="coL"></div>
    <div class="co-col co-r" id="coR"></div>
    <div class="bottom">
      <button class="marks top" id="marksBtn"></button>
      <div class="mid">
        <section class="eng3 sec" id="eng3" aria-label="Три двигателя выручки"></section>
        <section class="log sec" id="log" aria-label="Месяц по дням и 13 месяцев"></section>
      </div>
      <div id="stampSlot"></div>
    </div>
    <div id="inl" class="inline"></div>
    <button class="marks inline" id="marksBtn2"></button>
    <button class="win-big" id="winBig">Показать победу</button>
  </div>
</main>

<aside id="panel" aria-live="polite"><button class="x" id="px">Закрыть</button><div id="pb"></div></aside>
<div id="tip" role="status"></div>
<div id="win" aria-live="polite">
  <div class="w-pre" id="wPre"><b>ЗАЖИГАНИЕ</b><div class="w-lamps" id="wLamps"><i></i><i></i><i></i></div></div>
  <div class="w-num" id="wNum"></div>
  <div class="w-post" id="wPost"></div>
  <div id="flash"></div>
</div>

<script src="../data.js"></script>
<script src="../core.js"></script>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';

const MS = window.MS, D = MS.data, m = D.month, NB = ' ';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const phone = () => innerWidth <= 820;
const params = MS.params;

/* ------- Состояние победы ------- */
const WK = 'ms_02_won';
let won = false;
try { won = sessionStorage.getItem(WK) === '1'; } catch (e) {}
const monthWord = id => MS.monthName(id.slice(1)).split(' ')[0].toLowerCase();
function goalNow() {
  const g = won ? D.next[1] : D.next[0];
  const left = Math.max(g.rev - m.rev, 0);
  return { id: g.id, rev: g.rev, usd: g.usd, left, progress: Math.min(m.rev / g.rev, 1), name: monthWord(g.id), n: Math.round(g.rev / 1e6), lit: Math.floor(m.rev / 1e6) };
}

/* ------- Заполнение экрана данными ------- */
const eng = D.engines;
const ENG = [
  { id: 'came', k: 'Зашли в день', v: MS.comma(eng.came.now, 1), u: 'чел.', jan: MS.comma(eng.came.jan, 1) + NB + 'чел.', r: eng.came.now / eng.came.jan },
  { id: 'conv', k: 'Покупают', v: MS.pct(eng.conv.now), u: '', jan: MS.pct(eng.conv.jan), r: eng.conv.now / eng.conv.jan },
  { id: 'check', k: 'Средний чек', v: MS.mln(eng.check.now), u: 'млн' + NB + 'Rp', jan: MS.rp(eng.check.jan), r: eng.check.now / eng.check.jan }
];
const segBar = (n, lit, cls = '', head = false) => {
  let s = '';
  for (let i = 0; i < n; i++) s += '<i class="' + (i < lit ? 'on' : '') + (head && i === lit - 1 ? ' head' : '') + '"></i>';
  return '<div class="segs ' + cls + '">' + s + '</div>';
};
function paintGoal() {
  const g = goalNow();
  $('#gName').textContent = 'Вернуть ' + g.name;
  $('#gLeft').textContent = MS.rp(g.left);
  const box = $('#gSegs');
  let s = '';
  for (let i = 0; i < g.n; i++) s += '<i class="' + (i < g.lit ? 'on' : '') + (i === g.lit - 1 ? ' head' : '') + '"></i>';
  box.innerHTML = s;
  box.setAttribute('aria-label', g.lit + ' из ' + g.n + ' млн Rp');
  $('#gNote').textContent = 'Одно ребро крыши это 1' + NB + 'млн' + NB + 'Rp';
  $('#gPct').textContent = g.lit + ' из ' + g.n + ', ' + MS.pct(g.progress);
}
$('#addr').textContent = 'Дикий дом, ' + D.store.address + ', ' + D.store.place.split(',')[0];
$('#dayOf').textContent = 'День ' + m.day + ' из ' + m.days;
$('#revU').textContent = MS.usd(m.rev);
$('#fc').textContent = MS.rp(m.forecast);
paintGoal();

/* Линейка листа: дни месяца */
(() => {
  const r = $('#ruler'); let s = '';
  for (let i = 1; i <= m.days; i++) {
    const x = ((i - .5) / m.days * 100).toFixed(2);
    const t = i === 1 || i % 5 === 0;
    s += '<i class="' + (t ? 't ' : '') + (i === m.day ? 'now' : '') + '" style="left:' + x + '%"></i>';
    if (t && i !== m.day) s += '<span style="left:' + x + '%">' + i + '</span>';
  }
  r.innerHTML = s;
})();

/* Штамп */
const R = D.report;
$('#stamp').innerHTML =
  '<div class="st-h"><span class="k">Последний отчёт</span><b>' + MS.date(R.d) + '</b></div>' +
  '<div class="st-v"><span class="k">Выручка дня</span><b>' + MS.mln(R.rev) + ' <small>млн' + NB + 'Rp</small></b></div>' +
  '<div class="st-v"><span class="k">Зашли</span><b>' + R.came + '</b></div>' +
  '<div class="st-v"><span class="k">Купили</span><b>' + R.buy + '</b></div>' +
  '<div class="st-leg">Окно фасада это день месяца. Пламя это сейчас против января.</div>' +
  '<div class="st-vis" id="vis">' + esc(MS.visit.text) + '</div>' +
  '<button class="st-go" id="winBtn">Показать победу</button>';
if (!phone()) $('#stampSlot').appendChild($('#stamp'));

/* Находка дня */
$('#ins').textContent = MS.insight();

/* Задачи */
function paintTasks() {
  $('#taskList').innerHTML = MS.tasks().map(t =>
    '<button class="task" role="checkbox" aria-checked="' + t.done + '" data-i="' + t.i + '"><i class="box"></i><span class="txt">' + esc(t.t) + '<em>' + esc(t.tag) + '</em></span></button>').join('');
}
paintTasks();

/* Выноски */
const noSize = D.why.noSizeDays;
const dayW = n => n + NB + MS.plural(n, 'день', 'дня', 'дней');
const top3 = D.brands.sold30.slice(0, 3);
const rentDays = MS.rentNext.daysLeft;
const rentWhen = rentDays === 0 ? 'сегодня' : 'через ' + MS.daysWord(rentDays);
const CO = {
  reactor: { side: 'R', name: 'Реактор', word: 'Покупают', n: MS.pct(eng.conv.now), html: '<span class="s">В январе ' + MS.pct(eng.conv.jan) + '</span><span class="s lever">Нет размера <b>' + dayW(noSize) + '</b> из ' + D.why.of + '. Главный рычаг продаж</span>' },
  hull: { side: 'R', name: 'Корпус', word: 'Аренда', n: MS.date(MS.rentNext.d), html: '<span class="s"><b>' + MS.rp(MS.rentNext.mln * 1e6, 0) + '</b>, ' + rentWhen + '</span><span class="s">Оплачено ' + D.rent.paidPct + '%</span>' },
  hold: { side: 'L', name: 'Трюм', word: 'Бренды', n: D.brands.active30 + ' <small>за 30 дней</small>', html: '<span class="s">Приехало ' + D.brands.inCount + ', вернули ' + D.brands.outCount + '</span><span class="s">' + top3.map(b => esc(b.b) + ' ' + b.n).join(', ') + '</span>' },
  fuel: { side: 'L', name: 'Топливо', word: 'Инвестор', n: MS.num(D.investor.got) + ' <small>из ' + MS.usdRaw(D.investor.need) + '</small>', html: '<span class="s">Бак готов к заправке</span>' }
};
const coHTML = k => { const c = CO[k]; return '<span class="k">' + c.word + ' <i>' + c.name.toLowerCase() + '</i></span><span class="n">' + c.n + '</span>' + c.html; };
['hold', 'fuel'].forEach(k => { const b = document.createElement('button'); b.className = 'co'; b.dataset.k = k; b.innerHTML = coHTML(k); $('#coL').appendChild(b); });
['reactor', 'hull'].forEach(k => { const b = document.createElement('button'); b.className = 'co'; b.dataset.k = k; b.innerHTML = coHTML(k); $('#coR').appendChild(b); });

/* Три двигателя */
$('#eng3').innerHTML = ENG.map((e, i) =>
  '<button class="eng" data-k="engines" data-n="' + i + '"><span class="k">' + e.k + '</span><span class="n">' + e.v + (e.u ? ' <small>' + e.u + '</small>' : '') + '</span>' + segBar(20, Math.round(e.r * 20), 'ice') + '<span class="s">В январе ' + e.jan + '</span></button>').join('');

/* Графики */
const dayMax = Math.max(...D.days.map(d => d.rev));
const daysAll = [];
for (let i = 1; i <= m.days; i++) {
  const iso = m.key + '-' + String(i).padStart(2, '0');
  daysAll.push(D.days.find(d => d.d === iso) || { d: iso, future: true, rev: 0 });
}
const dayTip = d => d.future ? '<b>' + MS.date(d.d) + '</b>Отчёта ещё нет' : d.rev === 0 ? '<b>' + MS.date(d.d) + '</b>Тихий день, зашли ' + d.came : '<b>' + MS.date(d.d) + ', ' + MS.rp(d.rev) + '</b>Зашли ' + d.came + ', купили ' + d.buy;
function chartsHTML() {
  const g = goalNow();
  const dayCols = daysAll.map((d, i) => {
    const h = (Math.sqrt(0) + d.rev / dayMax * 100).toFixed(1);
    return '<div class="c ' + (d.future ? 'f' : d.rev === 0 ? 'z' : '') + (d.d === R.d ? ' me' : '') + '" data-tip="' + esc(dayTip(d)) + '" data-day="' + i + '"><i style="height:' + h + '%"></i></div>';
  }).join('');
  const zero = D.days.filter(d => d.rev === 0).length;
  const monMax = Math.max(...D.months.map(x => x.rev));
  const monCols = D.months.map(x => {
    const cur = x.m === m.key;
    return '<div class="c ' + (cur ? 'me' : '') + '" data-tip="' + esc('<b>' + MS.monthName(x.m) + '</b>' + MS.rp(x.rev) + ', ' + MS.usd(x.rev)) + '"><i style="height:' + (x.rev / monMax * 100).toFixed(1) + '%"></i></div>';
  }).join('');
  const gy = (g.rev / monMax * 100).toFixed(1);
  return '<div><div class="chart-h"><span class="k">Месяц по дням</span><span class="s">' + (m.withSale) + ' с продажами, ' + zero + ' тихих</span></div><div class="bars">' + dayCols + '</div><div class="ax"><span>1</span><span>10</span><span>20</span><span>' + m.days + '</span></div></div>' +
    '<div><div class="chart-h"><span class="k">13 месяцев</span><span class="s">Лучший ' + MS.rp(D.records.bestMonth.rev, 0) + '</span></div><div class="bars">' + monCols + '<div class="g" style="bottom:' + gy + '%"></div></div><div class="ax m">' + D.months.map(x => '<span>' + MS.monthShort(x.m) + '</span>').join('') + '</div></div>';
}
function paintCharts() { $('#log').innerHTML = chartsHTML(); }
paintCharts();

/* Коллекция */
const EMB = {
  'best-month-day': '<path d="M5 5h22v22H5zM12.3 5v22M19.6 5v22M5 12.3h22M5 19.6h22"/><path fill="currentColor" stroke="none" d="M12.3 12.3h7.3v7.3h-7.3z"/>',
  'record-day': '<path d="M4 27h24M7 27v-5M12 27v-8M17 27V5M22 27v-9M26 27v-4"/>',
  'record-month': '<path d="M4 27h24M6 27v-5h5v5M13.500 27V14h5v13M21 27V6h5v21"/>',
  'record-buy': '<path d="M8 11h16l2 16H6zM12 11V8a4 4 0 0 1 8 0v3"/>',
  'record-came': '<path d="M8 28V4h16v24M4 28h24M19 15v3"/>',
  'record-conv': '<circle cx="16" cy="16" r="11" opacity=".5"/><path d="M16 5a11 11 0 0 1 3 21.600" stroke-width="3"/>',
  'streak': '<path d="M4 8v16M9 8v16M14 8v16M19 8v16M24 8v16M28 8v16"/>',
  'google': '<path d="M16 4l3.600 8 8.400.8-6.300 5.600 1.800 8.600-7.500-4.400L8.500 27l1.800-8.600L4 12.800l8.400-.8z"/>',
  'items': '<path d="M16 9a3 3 0 1 0-3-3M16 9v3L4 21v4h24v-4l-12-9"/>',
  'total': '<circle cx="16" cy="16" r="3"/><circle cx="16" cy="16" r="7.500"/><circle cx="16" cy="16" r="12"/>',
  'next': '<path d="M13 4h6v6c0 6 5 9 7 18H6c2-9 7-12 7-18z"/>'
};
const fixV = v => String(v).replace(/(\d)\.(\d)/g, '$1,$2').replace(/(\d) (\d)/g, '$1' + NB + '$2');
const fixD = d => /^\d{4}-\d{2}-\d{2}$/.test(d) ? MS.date(d) : /^\d{4}-\d{2}$/.test(d) ? MS.monthName(d) : d;
function achList() {
  const list = D.achievements.map(a => Object.assign({}, a));
  if (won) {
    const x = list.find(a => a.id === 'next-' + D.next[0].id);
    if (x) Object.assign(x, { got: true, fresh: true, t: MS.win.title, v: MS.win.value, d: 'Новая полоса на корпусе' });
  }
  return list;
}
function plate(a) {
  const key = a.id.startsWith('next') ? 'next' : a.id;
  const em = '<svg viewBox="0 0 32 32" aria-hidden="true">' + (EMB[key] || EMB.next) + '</svg>';
  if (a.got) return '<div class="pl' + (a.fresh ? ' fresh' : '') + '"><span class="t">' + esc(a.t) + '</span>' + em + '<span class="v">' + esc(fixV(a.v)) + '</span><span class="d">' + esc(fixD(a.d)) + '</span></div>';
  return '<div class="pl off"><span class="t">' + esc(a.t.replace('Уровень', 'Вернуть')) + '</span>' + em + '<span class="v">' + esc(fixV(a.v)) + '</span><div class="pg"><i style="width:' + (a.progress * 100).toFixed(0) + '%"></i></div><span class="d">Пройдено ' + MS.pct(a.progress) + '</span></div>';
}
function marksMini() {
  const l = achList(), got = l.filter(a => a.got).length;
  return '<span class="k">Рекорды <i>отметки на борту</i></span><div class="row">' + l.map(a => '<i class="' + (a.got ? (a.fresh ? 'fresh' : '') : 'off') + '"></i>').join('') + '</div><span class="n">' + got + ' из ' + l.length + '</span>';
}
function paintMarks() { $('#marksBtn').innerHTML = marksMini(); $('#marksBtn2').innerHTML = marksMini(); }
paintMarks();

/* Панели отсеков */
const noSizeSet = D.days.map(d => d.why.includes('нет размера'));
const uniq = a => [...new Set(a.map(x => x.trim().toLowerCase()))].map(x => a.find(y => y.trim().toLowerCase() === x));
const PANELS = {
  engines() {
    return '<div class="k p-k">Три двигателя выручки <i>двигатели</i></div><p class="p-t">Выручка в день это зашли, умножить на покупают, умножить на средний чек.</p>' +
      ENG.map(e => '<div class="en-r"><div class="en-top"><span class="k">' + e.k + '</span><b>' + e.v + (e.u ? ' ' + e.u : '') + '</b></div>' + segBar(20, Math.round(e.r * 20), 'ice') + '<div class="rw" style="padding:0"><span>В январе ' + e.jan + '</span><span>Вернуть к январю, выручка ×' + MS.comma(1 / e.r, 1) + '</span></div></div>').join('') +
      '<p class="s" style="margin-top:10px">Вся шкала это январь 2026. Длина пламени в каждом сопле это та же шкала.</p>';
  },
  reactor() {
    return '<div class="k p-k">Покупают <i>реактор</i></div><div class="p-big">' + MS.pct(eng.conv.now) + '</div><p class="p-t">' + m.buy + ' покупок из ' + m.came + ' гостей за октябрь. В январе было ' + MS.pct(eng.conv.jan) + '.</p>' +
      '<div class="p-s"><h3>Почему не купили</h3><div class="rw"><span>Нет размера</span><b>' + dayW(noSize) + ' из ' + D.why.of + '</b></div>' +
      '<div class="dots">' + D.days.map((d, i) => '<i class="' + (noSizeSet[i] ? 'on' : '') + '" data-tip="' + esc('<b>' + MS.date(d.d) + '</b>' + (noSizeSet[i] ? 'Звучало «нет размера»' : 'Без этой причины')) + '"></i>').join('') + '</div>' +
      '<p class="s">Главный рычаг продаж. Гость уже зашёл и хотел купить. Просто смотрели в ' + dayW(D.why.lookDays) + ' из ' + D.why.of + '.</p></div>';
  },
  hold() {
    const top = D.brands.sold30, mx = top[0].n;
    return '<div class="k p-k">Бренды <i>трюм</i></div><div class="p-big">' + D.brands.active30 + '</div><p class="p-t">брендов продавались за 30 дней. В лучший месяц было ' + D.brands.peakCount + '.</p>' +
      '<div class="rw"><span>Приехало за 30 дней</span><b>' + D.brands.inCount + '</b></div><div class="rw"><span>Вернули за 30 дней</span><b>' + D.brands.outCount + '</b></div>' +
      '<div class="p-s"><h3>Топ по вещам за 30 дней</h3>' + top.slice(0, 6).map(b => '<div class="rw"><span style="min-width:90px">' + esc(b.b) + '</span><span class="bar"><i style="width:' + (b.n / mx * 100).toFixed(0) + '%"></i></span><b>' + b.n + '</b></div>').join('') + '</div>' +
      '<div class="p-s"><h3>Приехали недавно</h3><p class="s">' + uniq(D.brands.in30).map(esc).join(', ') + '</p></div>';
  },
  hull() {
    return '<div class="k p-k">Аренда <i>корпус</i></div><div class="p-big" style="font-size:44px">' + MS.date(MS.rentNext.d) + '</div><p class="p-t">Следующий платёж ' + MS.rp(MS.rentNext.mln * 1e6, 0) + ', ' + rentWhen + '.</p>' +
      '<div class="rw"><span>Оплачено</span><b>' + D.rent.paidPct + '%</b></div>' + segBar(100, D.rent.paidPct, 'ice tall') +
      '<div class="p-s"><h3>График платежей</h3>' + D.rent.schedule.map(s => '<div class="rw"><span>' + MS.date(s.d) + ' ' + s.d.slice(0, 4) + '</span><b>' + s.mln + NB + 'млн' + NB + 'Rp</b></div>').join('') + '</div>' +
      '<p class="s" style="margin-top:10px">После апреля 2027 ещё ' + D.rent.monthsFree + ' месяцев без платежей. Договор до ' + MS.date(D.rent.leaseEnd) + ' ' + D.rent.leaseEnd.slice(0, 4) + '.</p>';
  },
  fuel() {
    return '<div class="k p-k">Инвестор <i>топливо</i></div><div class="p-big">' + D.investor.got + ' <small>из ' + MS.usdRaw(D.investor.need) + '</small></div><p class="p-t">Бак пока пустой и готов к заправке. Это задача сегодняшнего дня.</p>' + segBar(107, 0, 'tall') +
      '<p class="s">Одно деление шкалы это 1' + NB + '000' + NB + '$.</p>';

      /* На слабом устройстве ритуал короче: три рваных кадра хуже быстрого */
      if (ritual.n === 3 && (now - ritual.t0) / 2 > .25) ritual.dur = 1;
      /* Не дольше 4 секунд с начала загрузки: при долгой загрузке сразу к данным */
      const k = performance.now() > 4000 ? 1 : (now - ritual.t0) / ritual.dur;
      U.uBuild.value = Math.min(k / .62, 1);
      U.uGround.value = Math.min(k / .3, 1);
      paneU.uLit.value = Math.max(0, (k - .42) / .38) * 34;
      seamU.value = Math.max(0, (k - .5) / .42) * seamTarget();
      flameK.v = Math.max(0, Math.min((k - .72) / .2, 1));
      U.uFlame.value = flameK.v * .7;
      if (k >= 1) { ritual.done = true; applyStatic(); flameK.v = 1; countDone = true; }
    }
    /* Движение покоя: медленное качание, не быстрее минуты */
    if (!win.on) {
      if (!state.focus && !drag.on && t - user.last > 9) { user.az *= 1 - dt * .4; user.el *= 1 - dt * .4; }
      setWant();
      if (!state.focus) want.az += Math.sin(t / 15) * .05;
      want.ty += ship.position.y;
    } else stepWin(t, dt);
    if (win.on && !win.closing) Object.assign(rig, want);
    else { const s = 1 - Math.exp(-dt * (state.focus ? 3.4 : 5)); for (const p in rig) rig[p] += (want[p] - rig[p]) * s; }
    camApply();
    const k3 = 1 - Math.exp(-dt * 6);
    U.uFocusK.value += ((state.focus ? 1 : 0) - U.uFocusK.value) * k3;
    if (state.focus) U.uFocusG.value = GROUP[state.focus];
    const lit = taskLit();
    turbines.forEach((b, i) => { const g = lit[i] ? .52 : .105; rotS[i] += (g - rotS[i]) * Math.min(dt, .1); b.rotation.y += rotS[i] * dt; });
    pulses.forEach(p => { if (p.t < 0) return; p.t += dt / .9; p.q.material.uniforms.uK.value = Math.min(p.t, 1); const sz = p.s * (.3 + p.t); p.q.scale.setScalar(sz); if (p.t >= 1) { p.t = -1; p.q.visible = false; } });
    setFlames(flameK.v, ship.position.y);
    renderer.render(scene, cam);
    updateLabels();
  }

  /* --- Перетаскивание и нажатия по модели --- */
  const drag = { on: false, x: 0, y: 0, moved: 0, id: 0, vert: false };
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function paneAt(x, y) {
    const r = canvas.getBoundingClientRect();
    ptr.set((x - r.left) / r.width * 2 - 1, -(y - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ptr, cam);
    const hit = ray.intersectObject(paneMesh)[0];
    const i = hit ? Math.floor(hit.faceIndex / 2) : -1;
    return i < 31 ? i : -1;
  }
  canvas.addEventListener('pointerdown', e => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY; drag.moved = 0; drag.id = e.pointerId; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
  canvas.addEventListener('pointermove', e => {
    if (drag.on) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      user.az -= dx * .0052; if (e.pointerType === 'mouse') user.el += dy * .003; user.last = lastT;
      if (MS.calm) { setWant(); Object.assign(rig, want); draw1(); }
      return;
    }
    if (e.pointerType === 'mouse' && !state.focus) {
      const i = paneAt(e.clientX, e.clientY);
      overPane = i >= 0;
      if (i >= 0 && daysAll[i]) { showTip(dayTip(daysAll[i]), e.clientX, e.clientY); paneU.uHover.value = i; }
      else if (paneU.uHover.value >= 0 && !e.target.closest('[data-tip]')) { paneU.uHover.value = -1; hideTip(); }
    }
  });
  const end = e => {
    if (!drag.on) return; drag.on = false; canvas.classList.remove('drag');
    if (drag.moved < 8) {
      skipRitual();
      if (win.on) return;
      const i = paneAt(e.clientX, e.clientY);
      if (i >= 0 && daysAll[i]) { showTip(dayTip(daysAll[i]), e.clientX, e.clientY); paneU.uHover.value = i; return; }
      let best = null, bd = 64;
      for (const k in ANCH) { const [x, y] = proj(ANCH[k]); const dd = Math.hypot(x - e.clientX, y - e.clientY); if (dd < bd) { bd = dd; best = k; } }
      if (best) openPanel(best); else if (state.focus) closePanel();
    }
  };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', () => { drag.on = false; canvas.classList.remove('drag'); });
  setHoverDay = d => { paneU.uHover.value = d === undefined ? -1 : +d; if (d === undefined) overPane = false; };

  function skipRitual() {
    if (ritual.done) return;
    ritual.done = true; applyStatic(); flameK.v = 1; countDone = true;
  }

  /* --- Победа: зажигание, дым, отрыв, новая полоса --- */
  const win = { on: false, t0: 0, phase: 0, rate: 2.2, closing: false };
  const wEl = $('#win'), flash = $('#flash'), wPre = $('#wPre'), wPost = $('#wPost'), wNum = $('#wNum'), lamps = [...$('#wLamps').children];
  let hitDone = false, countedFrom = m.rev;
  function playWin() {
    if (win.on) return;
    skipRitual(); closePanel(); hideTip();
    if (phone()) scrollTo(0, 0);
    win.on = true; win.t0 = lastT || performance.now() / 1000; win.closing = false; win.phase = 0; hitDone = false; win.start = null;
    document.body.classList.add('fly'); wEl.classList.add('on');
    wPost.classList.remove('on'); wPost.innerHTML = ''; wNum.style.opacity = 0; wPre.style.opacity = 1; lamps.forEach(l => l.classList.remove('on'));
    if (MS.calm) { wPre.style.opacity = 0; stripeU.value = 1; finishWin(); showPost(); draw1(); return; }
    MS.sound.rise(1.5);
    stripeU.value = 0;
  }
  const lerp = (a, b, k) => a + (b - a) * k, sm = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const mix3 = (a, b, k) => { const o = {}; for (const p in a) o[p] = lerp(a[p], b[p], k); return o; };
  /* Высота дома определяет всё вокруг: земля уходит вниз и съезжает под взгляд, проступают звёзды */
  const GX = 88, GZ = -172;
  function applyLift() {
    const y = ship.position.y, g = sm((y - 24) / 96);
    ground.position.set(GX * g, GY, GZ * g);
    gMat.uniforms.uLift.value = Math.min(y / 40, 1);
    gMat.uniforms.uG.value = 1 - g * .86;
    U.uSpace.value = sm((y - 20) / 70);
  }
  function stepWin(t, dt) {
    if (win.closing) return;
    const T_ = t - win.t0, ph = phone();
    const low = ph ? { az: -.72, el: -.05, d: 86, tx: 0, ty: -2.5, tz: 0, ox: 0, oy: -H * .05, fov: 30 } : { az: -.3, el: -.03, d: 74, tx: 0, ty: -2.8, tz: 0, ox: 0, oy: -H * .06, fov: 24 };
    const top = ph ? { az: -.86, el: .42, d: 112, tx: 0, ty: 1, tz: 0, ox: 0, oy: -H * .02, fov: 30 } : { az: -.42, el: .44, d: 82, tx: 0, ty: 1, tz: 0, ox: 0, oy: -H * .04, fov: 24 };
    if (!win.start) win.start = { ...rig };
    if (T_ < 1.5) {
      /* Предвкушение: пламя садится, дом дрожит, дым ползёт по земле */
      const q = T_ / 1.5;
      Object.assign(want, mix3(win.start, low, sm(T_ / 1.25)));
      flameK.v = 1 - .74 * sm(q * 2.4) + .55 * Math.pow(q, 5);
      U.uFlame.value = .5 + .4 * q;
      ship.position.y = Math.sin(t * 61) * .04 * q * q; ship.position.x = Math.sin(t * 47) * .07 * q * q;
      smokeT.value = T_ * .9;
      lamps.forEach((l, i) => l.classList.toggle('on', T_ > .3 + i * .4));
    } else {
      if (!hitDone) {
        hitDone = true;
        MS.sound.boom(); MS.sound.win(); MS.vibrate([60, 40, 160, 40, 260]);
        flash.style.transition = 'none'; flash.style.opacity = .96;
        requestAnimationFrame(() => requestAnimationFrame(() => { flash.style.transition = 'opacity .9s ease-out'; flash.style.opacity = 0; }));
        wPre.style.opacity = 0;
        gMat.uniforms.uBoom.value = 0;
        wNum.style.opacity = 1;
        wNum.innerHTML = '<span id="wN"></span> <small>млн' + NB + 'Rp</small>';
        MS.count($('#wN'), m.rev, D.next[0].rev, 2200, x => MS.mln(x));
      }
      const u = T_ - 1.5;
      smokeT.value = 1.35 + u * .95;
      gMat.uniforms.uBoom.value = u;
      /* Рёбра крыши дозаполняются волной */
      seamU.value = Math.max(seamU.value, Math.min(seamTarget() + u * .22, 1));
      const e = Math.min(u / 3, 1), lift = 130 * e * e * (3 - 2 * e);
      ship.position.y = lift; ship.position.x = Math.sin(t * 47) * .07 * Math.max(0, 1 - u * 1.5);
      applyLift();
      flameK.v = u < 2.5 ? Math.min(1 + u * 10, 4.4) : Math.max(4.4 - (u - 2.5) * 2.4, 1.35);
      U.uFlame.value = 1;
      const pose = mix3(low, top, sm(u / 2.8));
      pose.ty = lerp(low.ty, lift + 1, sm((u - .12) / 1.15));
      pose.az += u * .012;
      Object.assign(want, pose);
      if (T_ > 4.1 && stripeU.value < 1) { stripeU.value = Math.min(stripeU.value + dt * .9, 1); if (stripeU.value >= 1 && win.phase === 0) { win.phase = 1; MS.sound.chime(); } }
      if (T_ > 4.5 && !wPost.classList.contains('on')) showPost();
    }
  }
  function showPost() {
    wNum.style.opacity = 0;
    wPost.innerHTML = '<div class="k">Новая полоса на корпусе</div><h2>' + esc(MS.win.title) + '</h2><p>' + esc(MS.win.value) + ', ' + esc(MS.win.valueUsd) + '</p><span class="nx">' + esc(MS.win.sub) + '</span><span class="cl">Нажмите, чтобы вернуться</span>';
    wPost.classList.add('on');
    if (!won) finishWin();
  }
  function finishWin() { won = true; try { sessionStorage.setItem(WK, '1'); } catch (e) {} }
  function closeWin() {
    if (!win.on || win.closing) return;
    if (!wPost.classList.contains('on')) return;
    win.closing = true;
    wEl.classList.remove('on'); document.body.classList.remove('fly');
    paintGoal(); paintCharts(); paintMarks(); buildSeams(goalNow().n);
    seamU.value = 0; stripeU.value = 1; smokeT.value = -1; gMat.uniforms.uBoom.value = -1;
    /* Спуск на сетку одним плавным движением */
    const y0 = ship.position.y, t0 = performance.now(), dur = MS.calm ? 1 : 1500;
    (function down(now) {
      const k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
      ship.position.y = y0 * (1 - e); ship.position.x = 0;
      applyLift();
      flameK.v = 1.35 - .35 * e; seamU.value = seamTarget() * e; U.uFlame.value = .7 + .3 * (1 - e);
      if (k < 1) requestAnimationFrame(down); else { flameK.v = 1; win.closing = false; U.uFlame.value = .7; cacheRects(); if (MS.calm) draw1(); }
    })(t0);
    win.on = false;
  }
  wEl.addEventListener('click', closeWin);
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (win.on) closeWin(); else closePanel(); } });

  /* --- Отсеки --- */
  function openPanel(k) {
    if (win.on) return;
    MS.sound.click();
    state.focus = k; setWant();
    document.body.classList.add('open');
    $('#pb').innerHTML = PANELS[k]();
    $('#panel').classList.add('on');
    hsEls.forEach(h => h.el.classList.toggle('sel', h.k === k));
    const pn = $('#pNext'); if (pn) pn.onclick = nextInsight;
    if (phone()) scrollTo({ top: 0, behavior: 'smooth' });
    if (MS.calm) { Object.assign(rig, want); U.uFocusK.value = 1; U.uFocusG.value = GROUP[k]; draw1(); }
  }
  function closePanel() {
    if (!state.focus) return;
    state.focus = null; user.last = lastT; setWant();
    document.body.classList.remove('open');
    $('#panel').classList.remove('on');
    hsEls.forEach(h => h.el.classList.remove('sel'));
    if (MS.calm) { Object.assign(rig, want); U.uFocusK.value = 0; draw1(); }
  }
  function nextInsight() {
    const t = MS.nextInsight();
    $('#ins').textContent = t; const p = $('#pIns'); if (p) p.textContent = t;
    MS.sound.tick(); pulse(ANCH.antenna, 9);
  }
  G.openPanel = openPanel; G.closePanel = closePanel; G.nextInsight = nextInsight; G.pulse = pulse; G.ANCH = ANCH; G.playWin = playWin; G.setTaskFlash = i => pulse(TB[i].map((v, j) => j === 1 ? v + .9 : v), 6);

  /* --- Старт --- */
  addEventListener('resize', resize);
  new ResizeObserver(() => cacheRects()).observe(document.documentElement);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(() => cacheRects()); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => cacheRects()); }
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(canvas);
  W = innerWidth; H = innerHeight;
  resize();
  booted = true;
  Object.assign(rig, want);
  camApply();
  draw1();
  const go = () => { ritual.t0 = performance.now() / 1000; startCount(); if (!MS.calm) MS.loop(frame); };
  const fontIn = () => [...document.fonts].some(f => f.family.includes('Tektur') && f.status === 'loaded');
  const t00 = performance.now();
  (function hold() { if (MS.calm || params.has('win') || fontIn() || performance.now() - t00 > 800) go(); else setTimeout(hold, 50); })();
  MS.ready(playWin);
  G.skipRitual = skipRitual;
}

/* ------- События интерфейса ------- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-k]');
  if (c && G.openPanel) { G.openPanel(c.dataset.k); return; }
  const tb = e.target.closest('.task');
  if (tb) {
    const i = +tb.dataset.i, on = MS.toggleTask(i);
    tb.setAttribute('aria-checked', on);
    if (on) { tb.classList.remove('go'); void tb.offsetWidth; tb.classList.add('go'); MS.vibrate(12); G.setTaskFlash && G.setTaskFlash(i); }
    return;
  }
  if (e.target.closest('#ant')) { G.nextInsight ? G.nextInsight() : ($('#ins').textContent = MS.nextInsight()); return; }
  if (e.target.closest('#marksBtn,#marksBtn2')) { G.openPanel ? G.openPanel('marks') : 0; return; }
  if (e.target.closest('#winBtn,#winBig')) { MS.sound.init(); G.playWin && MS.playWin(); return; }
  if (e.target.closest('#px')) { G.closePanel && G.closePanel(); return; }
});
if (!glOK) MS.ready(() => {});
</script>
