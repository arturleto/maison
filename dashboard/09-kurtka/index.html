<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070806">
<link rel="icon" href="data:,">
<title>Лётная куртка. Maison Sauvage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all';window.__gf&&window.__gf()">
<style>
:root{
  --night:#070806; --ink:#f1e8d3; --mut:rgba(241,232,211,.84); --mand:#f4701c; --mand2:#ff8a3a;
  --paper:#f2e8d1; --paper2:#e6d9bc; --dark:#15160f; --dark2:rgba(21,22,15,.8);
  --disp:"Dela Gothic One",Georgia,serif; --text:"Onest",Georgia,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.3}
body{overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h2{font:400 15px/1.2 var(--disp)}

/* Космос */
#sky{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);z-index:0}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(52% 60% at 50% 37%,rgba(244,112,28,.13),rgba(244,112,28,.035) 55%,transparent 72%),
  radial-gradient(34% 40% at 12% -6%,rgba(241,232,211,.10),transparent 70%)}

#scene{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;z-index:1}
.sheet,.group{display:contents}
.group>h2,.coll,.sheet-seam{display:none}

/* Куртка */
.hero{position:absolute;left:0;top:0;width:1440px;height:640px;z-index:1}
.jk{position:absolute;left:0;top:-16px;width:1440px;height:640px}
.jk>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.sheen{position:absolute;inset:0;pointer-events:none;overflow:hidden;mix-blend-mode:screen;
  -webkit-mask:url(jacket.webp) center/100% 100% no-repeat;mask:url(jacket.webp) center/100% 100% no-repeat}
.sheen i{position:absolute;top:-20%;bottom:-20%;left:0;width:420px;transform:translateX(-520px) skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(214,230,170,.16) 45%,rgba(240,245,210,.26) 50%,rgba(214,230,170,.16) 55%,transparent);
  animation:sheen 10s linear infinite 3.5s}
@keyframes sheen{0%{transform:translateX(-520px) skewX(-18deg)}24%,100%{transform:translateX(1640px) skewX(-18deg)}}
#zip{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#patches{position:absolute;inset:0}
.patch{position:absolute;display:block;border-radius:50%;transition:opacity .35s,scale .4s cubic-bezier(.2,1.6,.4,1)}
.patch canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.patch:hover{scale:1.05}
.pre .patch{opacity:0;scale:1.5}
.patch.fresh::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px dashed var(--ink);animation:fresh 2.4s ease-out 3}
@keyframes fresh{0%{opacity:0;transform:scale(.9)}30%{opacity:.9}100%{opacity:0;transform:scale(1.14)}}

/* Нити и цепочки */
#threads{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
#threads path{fill:none}
.th{stroke:var(--ink);stroke-width:1.15;opacity:.82}
.th2{stroke:rgba(0,0,0,.45);stroke-width:2.2}
.ch{stroke:#c9ccc7;stroke-width:4.4;stroke-linecap:round;stroke-dasharray:.1 6}
.ch2{stroke:rgba(0,0,0,.5);stroke-width:5.4;stroke-linecap:round;stroke-dasharray:.1 6}

/* Общее для вещей */
.obj{position:absolute;z-index:3;transition:opacity .8s var(--d,0s),translate 1s var(--d,0s) cubic-bezier(.2,.9,.2,1);will-change:transform}
.pre .obj{opacity:0;translate:0 22px}
.lab{font-size:12px;font-weight:600;letter-spacing:.02em}

/* Шапка */
.mast{position:absolute;left:28px;top:20px;z-index:3}
.mast b{display:block;font:400 21px/1 var(--disp);letter-spacing:.01em}
.mast span{display:block;margin-top:6px;font-size:13px;color:var(--mut)}

/* Победа, кнопка */
#winBtn{position:absolute;right:28px;top:20px;z-index:4;height:48px;padding:0 22px;border-radius:24px;background:var(--mand);color:#180c03;font-weight:700;font-size:14.5px;
  box-shadow:inset 0 0 0 3px var(--mand),inset 0 0 0 4.2px rgba(24,12,3,.55),0 8px 22px rgba(0,0,0,.45);transition:translate .2s}
#winBtn:hover{translate:0 -1px}

/* Бирка */
.tag{left:505px;top:578px;width:430px;height:286px;padding:30px 26px 18px;color:var(--dark);--d:.25s;transform-origin:50% 0}
.tag::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(170deg,#f7eeda,#efe3c9 60%,#e7d9bb);
  clip-path:polygon(34px 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%,0 34px)}
.tagw{filter:drop-shadow(0 16px 24px rgba(0,0,0,.6))}
.eyelet{position:absolute;left:50%;top:10px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle,#0b0c08 0 4.5px,#b98d3f 5px,#f0d18a 6.5px,#8a6424 9px)}
.t-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.t-row .lab{font-size:13.5px;font-weight:700}
.t-num{display:flex;align-items:flex-end;gap:12px;margin-top:2px}
.t-num b{font:400 90px/1 var(--disp);letter-spacing:-.025em}
.t-num span{display:block;padding-bottom:13px}
.t-num i{display:block;font:400 18px/1.1 var(--disp)}
.t-num em{display:block;font-style:normal;font-weight:600;font-size:15px;margin-top:4px}
.t-fc{font-size:13px;font-weight:500;margin-top:11px}
.t-fc b{font-weight:700}
.t-goal{margin-top:7px;padding-top:7px;border-top:1.4px dashed rgba(21,22,15,.5)}
.t-gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.t-gh b{font-weight:700}
#gBar{display:block;width:100%;height:14px;margin:5px 0 4px}
.t-gf>span:last-child{text-align:right;font-size:12.5px;line-height:1.2;white-space:nowrap}
.t-gf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.t-gf b{font:400 17px/1 var(--disp)}

/* Жетоны */
.dogs{left:26px;top:358px;width:258px;--d:.5s}
.dog{position:relative;height:76px;margin-bottom:8px;padding:9px 14px 9px 34px;border-radius:20px 14px 14px 20px;color:#10110c;
  background:linear-gradient(118deg,#dfe2de,#a5aaa8 28%,#eceeea 47%,#b0b5b2 66%,#d7dad6);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -2px 3px rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.5)}
.dog::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#090a07;box-shadow:inset 0 1px 2px #000,0 1px 0 rgba(255,255,255,.7)}
.dog .lab{display:block;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.dog .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dog .now{display:block;font:400 23px/1.15 var(--disp);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.dog .jan{font-size:12px;font-weight:600;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.dog .bar{display:block;height:5px;margin-top:3px;border-radius:3px;background:rgba(16,17,12,.22);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.dog .bar i{display:block;height:100%;border-radius:3px;background:#10110c}

/* Вшитая бирка: отчёт */
.care{left:300px;top:336px;width:186px;height:258px;padding:18px 16px 14px;color:var(--dark);--d:.6s;
  background:repeating-linear-gradient(0deg,rgba(21,22,15,.035) 0 1px,transparent 1px 3px),linear-gradient(100deg,#fbf6ea,#efe7d6 55%,#f8f2e4);
  box-shadow:0 10px 18px rgba(0,0,0,.5);transform-origin:50% 0}
.care::before{content:"";position:absolute;left:8px;right:8px;top:7px;border-top:1.6px dashed rgba(21,22,15,.55)}
.care .d{font-size:13px;font-weight:600;margin-top:1px}
.care .v{font:400 25px/1.1 var(--disp);margin-top:11px}
.care .s{font-size:12px;font-weight:500}
.care dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:11px}
.care dt{font-size:12px;font-weight:500}
.care dd{font:400 21px/1.1 var(--disp)}
.care .vis{margin-top:11px;padding-top:9px;border-top:1px solid rgba(21,22,15,.3);font-size:12.5px;font-weight:600;line-height:1.25}

/* Аренда */
.rent{left:26px;top:616px;width:460px;--d:.75s}
.rent .h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rent .h b{font:400 16px/1.2 var(--disp)}
.rent .h span{font-size:13px;color:var(--mut)}
.rent .big{display:flex;gap:18px;align-items:baseline;margin-top:7px}
.rent .big b{font:400 25px/1.1 var(--disp)}
.rent .big span{font-size:13.5px;font-weight:500}
.tape{position:relative;height:44px;margin-top:10px;background:linear-gradient(180deg,#f4eacd,#e6d7ae);color:var(--dark);box-shadow:0 8px 14px rgba(0,0,0,.45);overflow:hidden}
.tape svg{position:absolute;inset:0;width:100%;height:100%}
.tape i{position:absolute;left:0;top:0;bottom:0;background:var(--mand);mix-blend-mode:multiply}

/* Находка дня */
.find{left:28px;top:70px;width:300px;--d:.9s;display:block;min-height:44px;padding:2px 0}
.find .lab{display:block;color:var(--mand2)}
.find .tx{display:block;font-size:13.5px;line-height:1.3;margin-top:2px;transition:opacity .25s}
.find .nx{display:block;margin-top:2px;font-size:12px;color:var(--mut);text-decoration:underline;text-underline-offset:3px}

/* Наряд на сегодня */
.ticket{left:954px;top:352px;width:460px;padding:15px 20px 12px;background:linear-gradient(165deg,#ff8630,#f26a17 60%,#e65e10);color:#180c03;--d:.35s;
  box-shadow:0 14px 24px rgba(0,0,0,.55),inset 0 0 0 5px transparent;transform-origin:50% 0}
.ticket::after{content:"";position:absolute;inset:6px;border:1.4px dashed rgba(24,12,3,.42);pointer-events:none}
.ticket .h{display:flex;justify-content:space-between;align-items:baseline}
.ticket .h b{font:400 20px/1.2 var(--disp)}
.ticket .h span{font-size:13px;font-weight:600}
.tk{display:flex;align-items:center;gap:13px;width:100%;min-height:54px;padding:5px 0;border-top:1px solid rgba(24,12,3,.26);position:relative}
.tk:first-of-type{margin-top:7px}
.snap{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7e6,#e6d9bc 45%,#b8a988);box-shadow:inset 0 0 0 3px rgba(24,12,3,.2),0 2px 3px rgba(0,0,0,.4);position:relative}
.snap svg{position:absolute;inset:0;width:100%;height:100%}
.snap path{fill:none;stroke:#180c03;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:3.4 2.6;stroke-dashoffset:0;opacity:0}
.tk.on .snap path{opacity:1;animation:sewtick .4s steps(5) both}
@keyframes sewtick{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.tk.pop .snap::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff7e6;animation:snap .5s ease-out both}
@keyframes snap{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.9)}}
.tk .t{flex:1;font-size:15px;font-weight:600;line-height:1.2}
.tk .c{font-size:12px;font-weight:700;white-space:nowrap}
.tk.on .t{opacity:.8}

/* Ярлык размера */
.size{left:954px;top:612px;width:216px;height:236px;padding:14px 16px;--d:.5s;color:var(--ink);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),#12130d;
  box-shadow:0 10px 18px rgba(0,0,0,.6),inset 0 0 0 1px rgba(241,232,211,.28)}
.size::before{content:"";position:absolute;inset:5px;border:1.2px dashed rgba(241,232,211,.42);pointer-events:none}
.size .lab{display:block}
.size .n{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.size .n b{font:400 58px/1 var(--disp);color:var(--ink)}
.size .n span{font-size:13px;font-weight:500;line-height:1.2}
.size .q{font-size:14px;font-weight:700;margin-top:6px}
.pips{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:8px}
.pips i{display:block;height:9px;background:transparent;box-shadow:inset 0 0 0 1px rgba(241,232,211,.45)}
.pips i.on{background:var(--mand);box-shadow:none}
.size .r{font-size:12.5px;margin-top:8px;line-height:1.25;color:var(--mut)}

/* Бренды */
.brands{left:1186px;top:612px;width:228px;--d:.65s}
.brands .h{font:400 16px/1.2 var(--disp)}
.brands .s{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px;margin-top:8px}
.brands .s b{display:block;font:400 25px/1.05 var(--disp)}
.brands .s span{font-size:12px;color:var(--mut)}
.wl{display:flex;justify-content:space-between;align-items:center;height:36px;margin-top:6px;padding:0 12px;color:var(--dark);font-weight:700;font-size:14px;letter-spacing:.05em;
  background:repeating-linear-gradient(0deg,rgba(21,22,15,.05) 0 1px,transparent 1px 3px),var(--paper);box-shadow:0 5px 10px rgba(0,0,0,.45)}
.wl:first-of-type{margin-top:10px}
.wl i{font-style:normal;font-family:var(--disp);font-weight:400;font-size:16px}
.wl.m{background:repeating-linear-gradient(0deg,rgba(21,22,15,.06) 0 1px,transparent 1px 3px),var(--mand)}
.wl.k{background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),#12130d;color:var(--ink);box-shadow:0 5px 10px rgba(0,0,0,.45),inset 0 0 0 1px rgba(241,232,211,.3)}

/* Карман инвестора, намечен мелом */
.inv{left:932px;top:216px;width:126px;height:78px;padding:10px 11px;transform-origin:50% 50%;rotate:7deg;--d:.8s;
  border:1.6px dashed rgba(241,232,211,.9);border-top-width:3px;border-radius:2px 2px 10px 10px;background:rgba(14,16,9,.62)}
.inv .lab{display:block;font-size:12.5px}
.inv b{display:block;margin-top:3px;font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
.inv span{font-size:12px;font-weight:500}

/* Рукава: графики */
.chart{width:250px;height:134px;padding:0;--d:.4s}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart text{font-family:var(--text);fill:var(--ink)}
.c-days{left:125px;top:170px;rotate:-8deg}
.c-months{left:1065px;top:170px;rotate:8deg}
.c-box{fill:rgba(12,13,8,.84)}
.c-stitch{fill:none;stroke:rgba(241,232,211,.6);stroke-width:1.1;stroke-dasharray:4 3}
.st{opacity:1}
.pre .st,.sewing .st{opacity:0}
.sewing .st{animation:sewin .22s forwards;animation-delay:calc(var(--i)*30ms + .4s)}
@keyframes sewin{to{opacity:1}}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(241,232,211,.1)}

/* Подсказка */
#tip{position:fixed;z-index:30;left:0;top:0;max-width:240px;padding:7px 11px;background:var(--paper);color:var(--dark);font-size:13px;font-weight:500;line-height:1.28;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 8px 18px rgba(0,0,0,.55)}
#tip.on{opacity:1}
#tip b{display:block;font-weight:700}

/* Победа */
#win{position:fixed;inset:0;z-index:60;display:none;overflow:hidden}
#win.on{display:block}
.w-dim{position:absolute;inset:0;background:#040503;opacity:0;transition:opacity 1.2s}
#win.a .w-dim{opacity:.9}
#win.b .w-dim{opacity:.45;transition:opacity .5s}
#win.c .w-dim{opacity:.7;transition:opacity 1s}
.w-hoop{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity .7s,transform 1.6s cubic-bezier(.2,.8,.2,1)}
#win.a .w-hoop{opacity:1;transform:translate(-50%,-50%) scale(1)}
#win.b .w-hoop{opacity:0;transition:opacity .16s}
.w-hoop canvas{display:block;width:100%;height:100%}
.w-head{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.w-head i{position:absolute;left:-1.5px;bottom:0;width:3px;height:64px;background:linear-gradient(180deg,#8f9391,#f2f3ef 55%,#fff)}
.w-head b{position:absolute;left:-38px;bottom:60px;width:76px;height:100vh;background:linear-gradient(90deg,#17180f,#34362a 30%,#4a4c3e 48%,#23241a 70%,#0f100a);border-radius:10px 10px 0 0;box-shadow:0 0 0 1px rgba(241,232,211,.12)}
.w-head u{position:absolute;left:-15px;bottom:9px;width:30px;height:12px;border:3px solid #cfd2cf;border-top:0;border-radius:0 0 8px 8px}
.w-cap{position:absolute;left:0;right:0;bottom:13%;text-align:center;font-size:15px;font-weight:600;color:var(--ink);opacity:0;transition:opacity .6s}
#win.a .w-cap{opacity:1}
#win.b .w-cap{opacity:0;transition:opacity .1s}
.w-flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 47%,#fff6e4 0,#ffb066 22%,#f4701c 52%,rgba(244,112,28,0) 92%)}
.w-fly{position:fixed;left:0;top:0;z-index:62;will-change:transform;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.w-ring{position:fixed;z-index:61;border:3px solid var(--ink);border-radius:50%;pointer-events:none}
.w-after{position:absolute;left:50%;bottom:calc(9% + 8px);width:min(620px,calc(100% - 28px));padding:24px 30px 20px;transform:translate(-50%,16px);opacity:0;transition:opacity .9s,transform .9s;color:var(--dark);text-align:center;
  background:repeating-linear-gradient(0deg,rgba(21,22,15,.04) 0 1px,transparent 1px 3px),linear-gradient(170deg,#f8efdc,#ecdfc4);box-shadow:0 20px 44px rgba(0,0,0,.65)}
.w-after::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(21,22,15,.5);pointer-events:none}
#win.c .w-after{opacity:1;transform:translate(-50%,0)}
.w-after h3{font:400 40px/1.1 var(--disp)}
.w-after .v{margin-top:9px;font-size:20px;font-weight:700}
.w-after .n{margin-top:7px;font-size:15px;font-weight:500}
.w-after .x{margin-top:9px;font-size:12.5px;font-weight:500}
.shake{animation:shake .5s linear}
@keyframes shake{0%,100%{translate:0 0}15%{translate:-5px 3px}30%{translate:4px -4px}45%{translate:-3px 2px}60%{translate:2px -2px}80%{translate:-1px 1px}}

/* Телефон */
@media (max-width:820px),(max-height:520px){
  html,body{height:auto}
  body{overflow-x:hidden;overflow-y:auto}
  #sky,.glow{position:fixed}
  #scene{position:relative;width:100%;height:auto;--k:calc(.68*min(100vw/390px,1.5));overflow:clip}
  .mast{position:relative;left:auto;top:auto;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
  .mast b{font-size:17px}
  .mast span{margin-top:3px;font-size:12.5px}
  .hero{position:relative;width:100%;height:calc(var(--hk)*600px);margin-top:-8px}
  .jk{left:50%;top:0;transform-origin:0 0;transform:scale(var(--hk)) translateX(-50%)}
  .obj{position:relative;left:auto;top:auto;right:auto;rotate:none;will-change:auto}
  .tag{width:calc(100% - 28px);max-width:440px;height:auto;margin:calc(var(--hk)*-46px) auto 0;padding:28px 20px 14px;display:block}
  .tagw{position:relative;z-index:3}
  .t-num b{font-size:78px}
  .t-num i{font-size:16px}
  .t-num span{padding-bottom:10px}
  #winBtn{position:relative;right:auto;top:auto;display:block;width:calc(100% - 28px);max-width:440px;margin:12px auto 18px;text-align:center;height:50px}
  .sheet{display:block;position:relative;z-index:3;padding:6px 14px calc(84px + env(safe-area-inset-bottom));background:url(lining.webp) 0 0/110px 110px;color:var(--dark)}
  .sheet-seam{display:block;position:absolute;left:0;right:0;top:5px;border-top:2px dashed rgba(24,12,3,.55)}
  .group{display:block;padding-top:26px}

<script>
(function(){
'use strict';
const MS=window.MS, D=MS.data, M=D.month, NB=' ';
const $=s=>document.querySelector(s);
const svgNS='http://www.w3.org/2000/svg';
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const isPhone=()=>matchMedia('(max-width:820px),(max-height:520px)').matches;
const quiet=MS.calm||MS.params.has('shot');

/* ---------- Цель ---------- */
const WKEY='ms_kurtka_win';
let won=false; try{won=sessionStorage.getItem(WKEY)==='1'}catch(e){}
const monthGen=g=>{const m=/^m(\d{4})-(\d{2})$/.exec(g.id||'');return m?MS.date(m[1]+'-'+m[2]+'-01').split(NB)[1]:null};
const goalOf=g=>{const mg=monthGen(g);return Object.assign({},g,{
  left:Math.max(g.rev-M.rev,0),prog:Math.min(M.rev/g.rev,1),teeth:Math.max(Math.round(g.rev/1e6),1),
  name:mg?'Уровень '+mg:g.label})};
let goal=goalOf(won?D.next[1]:D.next[0]);

/* ---------- Подписи ---------- */
$('#mastSub').textContent=MS.monthName(M.key)+'. '+D.store.place;
$('#tDay').textContent='День '+M.day+' из '+M.days;
$('#tUsd').textContent=MS.usd(M.rev);
$('#tFc').textContent=MS.rp(M.forecast);
const tNum=$('#tNum');
tNum.textContent=MS.mln(M.rev);

function paintGoal(){
  $('#gName').textContent=goal.name;
  $('#gLeft').textContent=MS.rp(goal.left);
  $('#gPct').innerHTML='Пройдено '+MS.pct(goal.prog)+'<br>1 зуб молнии = 1'+NB+'млн'+NB+'Rp';
  const n=goal.teeth,w=378,h=16,s=w/n,g=$('#gBar');
  g.setAttribute('viewBox','0 0 '+w+' '+h);
  let a='',b='';
  for(let i=0;i<n;i++){
    const r='M'+(i*s+.5).toFixed(1)+' 2h'+Math.max(s-1.6,1.4).toFixed(1)+'v12h-'+Math.max(s-1.6,1.4).toFixed(1)+'z';
    if(i<M.rev/1e6) a+=r; else b+=r;
  }
  const fx=clamp(M.forecast/1e6*s,0,w);
  g.innerHTML='<path d="'+b+'" fill="rgba(21,22,15,.24)"/><path d="'+a+'" fill="#d9590c"/><path d="M'+fx.toFixed(1)+' 0v16" stroke="#15160f" stroke-width="2"/>';
}
paintGoal();

/* ---------- Подсказка ---------- */
const tip=$('#tip');
function showTip(html,e){
  tip.innerHTML=html;tip.classList.add('on');
  const r=tip.getBoundingClientRect();
  const x=clamp((e.clientX||0)-r.width/2,8,innerWidth-r.width-8), y=(e.clientY||0)-r.height-14;
  tip.style.transform='translate('+x+'px,'+(y<8?(e.clientY||0)+18:y)+'px)';
}
const hideTip=()=>tip.classList.remove('on');
function withTip(node,fn){
  node.addEventListener('pointerenter',e=>showTip(fn(),e));
  node.addEventListener('pointermove',e=>showTip(fn(),e));
  node.addEventListener('pointerleave',hideTip);
  node.addEventListener('click',e=>{e.stopPropagation();showTip(fn(),e)});
}
addEventListener('scroll',hideTip,{passive:true});
addEventListener('pointerdown',e=>{if(!e.target.closest('.hit,.patch,.cl'))hideTip()});

/* ---------- Звёзды ---------- */
function sky(){
  const c=$('#sky'),dpr=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr;c.height=h*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  x.fillStyle='#070806';x.fillRect(0,0,w,h);
  let seed=1966;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.round(w*h/2600);
  for(let i=0;i<n;i++){
    const s=R(),px=R()*w,py=R()*h,r=s>.985?1.5:s>.9?1:.6;
    x.globalAlpha=.25+R()*.6;x.fillStyle=s>.92?'#ffe2bd':'#e8eadd';
    x.beginPath();x.arc(px,py,r,0,7);x.fill();
  }
  x.globalAlpha=1;
}

/* ---------- Движок вышивки ----------
   Маску формы режем на ряды под углом нити: каждый ряд это настоящий проход иглы.
   Один план и для готовых нашивок, и для победы, где ряды кладутся по очереди. */
const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const c=v=>clamp(Math.round(v*f),0,255);return 'rgb('+c(r)+','+c(g)+','+c(b)+')'};
const P={ink:'#12130d',olive:'#3b4524',oliveL:'#5c6a38',cream:'#f0e4c6',mand:'#f4701c',gold:'#d8ae55',blue:'#183049',sky:'#3b6e91',rust:'#a8440f',bone:'#d9caa3'};

function perimeter(kind){
  const pts=[];
  if(kind==='hex'){const v=[];for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3;v.push([50+47*Math.cos(a),50+47*Math.sin(a)])}
    for(let i=0;i<6;i++){const p=v[i],q=v[(i+1)%6];for(let t=0;t<1;t+=.02)pts.push([lerp(p[0],q[0],t),lerp(p[1],q[1],t)])}}
  else if(kind==='shield'){
    const c=(a,b,cc,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*cc[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*cc[1]+t*t*b[1]];
    for(let t=0;t<1;t+=.012)pts.push(c([6,10],[94,10],[50,18],t));
    for(let t=0;t<1;t+=.012)pts.push(c([94,10],[50,97],[95,70],t));
    for(let t=0;t<1;t+=.012)pts.push(c([50,97],[6,10],[5,70],t));
  } else for(let i=0;i<220;i++){const a=i/220*Math.PI*2;pts.push([50+47*Math.cos(a),50+47*Math.sin(a)])}
  return pts;
}
const tracePts=(x,pts,u)=>{x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0]*u,p[1]*u):x.moveTo(p[0]*u,p[1]*u));x.closePath()};

function arcText(x,str,cx,cy,r,mid,fs,up){
  x.save();x.font='700 '+fs+'px Onest, Georgia, serif';x.textAlign='center';x.textBaseline='middle';
  const sp=fs*.09,ws=[...str].map(c=>x.measureText(c).width+sp),tot=ws.reduce((a,b)=>a+b,0);
  let a=mid-(up?1:-1)*tot/2/r;
  [...str].forEach((c,i)=>{const d=ws[i]/2/r;a+=up?d:-d;
    x.save();x.translate(cx+r*Math.cos(a),cy+r*Math.sin(a));x.rotate(up?a+Math.PI/2:a-Math.PI/2);x.fillText(c,0,0);x.restore();
    a+=up?d:-d});
  x.restore();
}
const fitFont=(x,str,max,fs,fam)=>{for(;fs>6;fs-=.5){x.font=fs+'px '+fam;if(x.measureText(str).width<=max)break}return fs};

const motif={
  rocket(x,u,cx,cy,s,rot){x.save();x.translate(cx*u,cy*u);x.rotate(rot||0);x.scale(s*u,s*u);x.beginPath();x.moveTo(0,-1);x.quadraticCurveTo(.46,-.45,.33,.5);x.lineTo(-.33,.5);x.quadraticCurveTo(-.46,-.45,0,-1);
    x.moveTo(.32,.12);x.lineTo(.74,.82);x.lineTo(.28,.56);x.closePath();x.moveTo(-.32,.12);x.lineTo(-.74,.82);x.lineTo(-.28,.56);x.closePath();x.fill();x.restore()},
  flame(x,u,cx,cy,s,rot){x.save();x.translate(cx*u,cy*u);x.rotate(rot||0);x.scale(s*u,s*u);x.beginPath();x.moveTo(-.26,.58);x.quadraticCurveTo(0,1.5,.26,.58);x.closePath();x.fill();x.restore()},
  star(x,u,cx,cy,r,n){x.beginPath();n=n||5;for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,q=(i%2?r*.42:r)*u;const px=cx*u+q*Math.cos(a),py=cy*u+q*Math.sin(a);i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill()},
  sun(x,u,cx,cy,r){x.beginPath();x.arc(cx*u,cy*u,r*.56*u,0,7);x.fill();for(let i=0;i<10;i++){const a=i/10*Math.PI*2;x.beginPath();x.moveTo((cx+Math.cos(a-.14)*r*.66)*u,(cy+Math.sin(a-.14)*r*.66)*u);x.lineTo((cx+Math.cos(a)*r*1.12)*u,(cy+Math.sin(a)*r*1.12)*u);x.lineTo((cx+Math.cos(a+.14)*r*.66)*u,(cy+Math.sin(a+.14)*r*.66)*u);x.closePath();x.fill()}},
  moon(x,u,cx,cy,r){x.beginPath();x.arc(cx*u,cy*u,r*u,.75,5.6);x.arc((cx+r*.5)*u,(cy-r*.08)*u,r*.8*u,5.25,1.1,true);x.closePath();x.fill()},
  bag(x,u,cx,cy,s){x.beginPath();x.rect((cx-s*.8)*u,(cy-s*.35)*u,s*1.6*u,s*1.3*u);x.fill();x.lineWidth=s*.24*u;x.beginPath();x.arc(cx*u,(cy-s*.35)*u,s*.46*u,Math.PI,0);x.stroke()},
  door(x,u,cx,cy,s){x.beginPath();x.moveTo((cx-s*.7)*u,(cy+s)*u);x.lineTo((cx-s*.7)*u,(cy-s*.25)*u);x.arc(cx*u,(cy-s*.25)*u,s*.7*u,Math.PI,0);x.lineTo((cx+s*.7)*u,(cy+s)*u);x.closePath();
    x.moveTo((cx-s*.34)*u,(cy+s)*u);x.lineTo((cx+s*.34)*u,(cy+s)*u);x.lineTo((cx+s*.34)*u,(cy-s*.2)*u);x.arc(cx*u,(cy-s*.2)*u,s*.34*u,0,Math.PI,true);x.closePath();x.fill('evenodd')},
  target(x,u,cx,cy,r){x.lineWidth=r*.24*u;x.beginPath();x.arc(cx*u,cy*u,r*.86*u,0,7);x.stroke();x.beginPath();x.arc(cx*u,cy*u,r*.34*u,0,7);x.fill()},
  hanger(x,u,cx,cy,s){x.lineWidth=s*.2*u;x.lineJoin='round';x.lineCap='round';x.beginPath();x.moveTo((cx-s)*u,(cy+s*.7)*u);x.lineTo(cx*u,(cy-s*.05)*u);x.lineTo((cx+s)*u,(cy+s*.7)*u);x.closePath();x.stroke();x.beginPath();x.moveTo(cx*u,(cy-s*.05)*u);x.lineTo(cx*u,(cy-s*.32)*u);x.arc((cx+s*.2)*u,(cy-s*.52)*u,s*.26*u,2.4,-2.6,false);x.stroke()},
  planet(x,u,cx,cy,r){x.beginPath();x.arc(cx*u,cy*u,r*.6*u,0,7);x.fill();x.lineWidth=r*.16*u;x.beginPath();x.ellipse(cx*u,cy*u,r*1.16*u,r*.36*u,-.36,0,7);x.stroke()}
};

/* Дизайн нашивок: по одному на достижение, форма, цвет и знак свои */
const DESIGN={
 'record-month':{shape:'circle',bg:P.blue,edge:P.gold,num:P.cream,arc:'РЕКОРД МЕСЯЦА',m:[[P.mand,(x,u)=>{motif.flame(x,u,73,30,10,.75)}],[P.cream,(x,u)=>{motif.rocket(x,u,73,30,12,.75);motif.star(x,u,25,34,4);motif.star(x,u,35,24,2.6)}]]},
 'record-day':{shape:'shield',bg:P.ink,edge:P.mand,num:P.cream,top:'РЕКОРД ДНЯ',ny:50,m:[[P.mand,(x,u)=>motif.sun(x,u,50,31,9)]]},
 'best-month-day':{shape:'circle',bg:P.olive,edge:P.cream,num:P.cream,arc:'ЛУЧШИЙ ДЕНЬ',m:[[P.gold,(x,u)=>{motif.moon(x,u,50,31,8.5)}]]},
 'record-buy':{shape:'hex',bg:P.mand,edge:P.ink,num:P.ink,top:'ПОКУПКИ',ny:63,unit:'за день',unitC:P.ink,m:[[P.ink,(x,u)=>motif.bag(x,u,50,39,5.5)]]},
 'record-came':{shape:'hex',bg:P.sky,edge:P.cream,num:P.cream,top:'ГОСТИ',ny:63,unit:'за день',unitC:P.cream,m:[[P.cream,(x,u)=>motif.door(x,u,50,39,5.5)]]},
 'record-conv':{shape:'circle',bg:P.ink,edge:P.mand,num:P.mand,arc:'ПОКУПАЮТ',m:[[P.cream,(x,u)=>motif.target(x,u,50,31,8)]]},
 'streak':{shape:'circle',bg:P.rust,edge:P.cream,num:P.cream,arc:'ДНЕЙ ПОДРЯД',m:[],dots:true},
 'google':{shape:'shield',bg:P.cream,edge:P.ink,num:P.ink,top:'GOOGLE',ny:56,unitC:P.ink,m:[[P.mand,(x,u)=>{motif.star(x,u,50,31,8.5)}]]},
 'items':{shape:'circle',bg:P.oliveL,edge:P.ink,num:P.cream,arc:'ВЕЩЕЙ ПРОДАНО',m:[[P.cream,(x,u)=>motif.hanger(x,u,50,31,10)]]},
 'total':{shape:'circle',bg:P.ink,edge:P.gold,num:P.cream,arc:'С ОТКРЫТИЯ',m:[[P.gold,(x,u)=>motif.planet(x,u,50,31,10)]]},
 'win':{shape:'hex',bg:P.mand,edge:P.cream,num:P.ink,top:'ПОБЕДА',ny:63,unitC:P.ink,m:[[P.cream,(x,u)=>{motif.rocket(x,u,50,41,8.5,0)}],[P.ink,(x,u)=>{motif.star(x,u,32,40,3);motif.star(x,u,68,40,3)}]]}
};

function splitValue(v){
  v=String(v).replace(/\./g,',');
  const m=/^([\d\s ,]+%?)\s*(.*)$/.exec(v);
  return m?[m[1].trim(),m[2].trim()]:[v,''];
}

function layersFor(spec,W){
  const u=W/100,Dn='"Dela Gothic One", Georgia, serif',pts=perimeter(spec.shape),L=[];
  const [num,unit]=[spec.value,spec.unitText];
  L.push({draw:x=>{tracePts(x,pts,u);x.fill()},color:spec.bg,angle:-28,kind:'tatami'});
  (spec.m||[]).forEach((m,i)=>L.push({draw:x=>{x.fillStyle=x.strokeStyle='#fff';m[1](x,u)},color:m[0],angle:38+i*50}));
  if(spec.dots)L.push({draw:x=>{for(let i=0;i<37;i++){const a=i/37*Math.PI*2-Math.PI/2;x.beginPath();x.arc((50+13.5*Math.cos(a))*u,(30+7*Math.sin(a))*u,.95*u,0,7);x.fill()}},color:P.cream,angle:0,fine:1});
  if(spec.arc)L.push({draw:x=>arcText(x,spec.arc,50*u,50*u,37.5*u,-Math.PI/2,spec.arcFs*u,true),color:spec.num===P.mand?P.cream:spec.num,angle:8,fine:1});
  if(spec.top)L.push({draw:x=>{const hx=spec.shape==='hex',fs=fitFont(x,spec.top,(hx?52:66)*u,11.5*u,'Onest');x.font='700 '+fs+'px Onest, Georgia, serif';x.textAlign='center';x.textBaseline='middle';x.fillText(spec.top,50*u,(hx?25:20)*u)},color:spec.num,angle:8,fine:1});
  const ny=spec.ny||(unit?56:60);
  L.push({draw:x=>{const fs=fitFont(x,num,70*u,num.length>4?20*u:29*u,Dn);x.font=fs+'px '+Dn;x.textAlign='center';x.textBaseline='middle';x.fillText(num,50*u,ny*u)},color:spec.num,angle:14,fine:1});

/* План: список проходов иглы */
function planOf(layers,W){
  const res=W/100,out=[];
  for(const L of layers){
    const pal=[.86,.93,1,1.06,1.14].map(f=>shade(L.color,f));
    if(L.kind==='merrow'){
      const pts=L.pts,n=pts.length,per=[];let acc=0;
      for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],d=Math.hypot(q[0]-p[0],q[1]-p[1]);acc+=d;per.push([p,q,d])}
      const gap=1.05,lw=1.5*res;let next=0,run=0,k=0;
      for(const [p,q,d] of per){
        while(next<=run+d){
          const t=(next-run)/d,x0=lerp(p[0],q[0],t),y0=lerp(p[1],q[1],t),tx=(q[0]-p[0])/d,ty=(q[1]-p[1])/d;
          const nx=-ty,ny=tx,sx=50-x0,sy=50-y0,flip=(nx*sx+ny*sy)>0?1:-1;
          const ix=x0+nx*flip*3.6-tx*1.5,iy=y0+ny*flip*3.6-ty*1.5,ox=x0-nx*flip*1.8+tx*1.1,oy=y0-ny*flip*1.8+ty*1.1;
          out.push([ix*res,iy*res,ox*res,oy*res,pal[(k*5+((k*2654435761>>>0)%3))%5],lw]);
          next+=gap;k++;
        }
        run+=d;
      }
      continue;
    }
    const a=(L.angle||0)*Math.PI/180,Pz=Math.ceil(W*1.5);
    const off=document.createElement('canvas');off.width=off.height=Pz;
    const x=off.getContext('2d',{willReadFrequently:true});
    x.translate(Pz/2,Pz/2);x.rotate(-a);x.translate(-W/2,-W/2);x.fillStyle=x.strokeStyle='#fff';L.draw(x);
    const d=x.getImageData(0,0,Pz,Pz).data,ca=Math.cos(a),sa=Math.sin(a);
    const step=(L.fine?.5:.62)*res,lw=step*1.02;
    const push=(i0,i1,j,row)=>{const u0=i0-Pz/2,v=j-Pz/2,u1=i1-Pz/2;
      out.push([u0*ca-v*sa+W/2,u0*sa+v*ca+W/2,u1*ca-v*sa+W/2,u1*sa+v*ca+W/2,pal[(row*3+((row*2654435761>>>0)>>>7))%5],lw])};
    let row=0;
    for(let r=0;r<Pz;r+=step,row++){
      const j=Math.round(r);if(j>=Pz)break;
      const rs=[];let s=-1;
      for(let i=0;i<Pz;i++){const on=d[(j*Pz+i)*4+3]>120;if(on&&s<0)s=i;if(!on&&s>=0){rs.push([s,i]);s=-1}}
      if(s>=0)rs.push([s,Pz]);
      if(row%2)rs.reverse();
      for(const [i0,i1] of rs){
        if(L.kind==='tatami'&&i1-i0>7*res){
          const seg=6.5*res,o=(row%3)*seg/3;let c=i0-o;
          const parts=[];while(c<i1){const b=Math.min(c+seg,i1),a0=Math.max(c,i0);if(b-a0>.4)parts.push([a0,b-.35*res]);c+=seg}
          if(row%2)parts.reverse();
          parts.forEach(p=>push(p[0],p[1],j,row+((p[0]|0)%2)));
        } else push(i0,i1,j,row);
      }
    }
  }
  return out;
}
function paintRuns(x,runs,from,to){
  let cur='';x.lineCap='butt';to=Math.min(to,runs.length);
  for(let i=from;i<to;i++){const r=runs[i];
    if(r[4]!==cur){cur=r[4];x.strokeStyle=cur}
    x.lineWidth=r[5];x.beginPath();x.moveTo(r[0],r[1]);x.lineTo(r[2],r[3]);x.stroke();
  }
}
/* Подложка и объём: тёмный низ под нитками и мягкий свет сверху */
function underlay(x,spec,W){const u=W/100;tracePts(x,perimeter(spec.shape),u);x.fillStyle=shade(spec.bg,.5);x.fill()}
function finishLight(x,spec,W){
  const u=W/100;x.save();tracePts(x,perimeter(spec.shape),u);x.clip();x.globalCompositeOperation='soft-light';
  const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(128,128,128,0)');g.addColorStop(1,'rgba(0,0,0,.55)');
  x.fillStyle=g;x.fillRect(0,0,W,W);x.restore();
}
function specOf(a){
  const d=DESIGN[a.id]||{shape:'circle',bg:P.olive,edge:P.cream,num:P.cream,arc:a.t.toUpperCase().slice(0,14)};
  const [v,un]=splitValue(a.v);
  const s=Object.assign({},d,{value:v,unitText:un||d.unit||''});
  if(s.arc)s.arcFs=clamp(11.6*13/Math.max(s.arc.length,11),10.5,12.4);

}
function embroider(cv,spec,W){
  cv.width=cv.height=W;const x=cv.getContext('2d');
  underlay(x,spec,W);paintRuns(x,planOf(layersFor(spec,W),W),0,1e9);finishLight(x,spec,W);
}

function chalk(cv,a,W){

  x.lineWidth=4.4*u;x.beginPath();x.arc(50*u,50*u,39.5*u,-Math.PI/2,-Math.PI/2+a.progress*Math.PI*2);x.stroke();
  x.textAlign='center';x.textBaseline='middle';

  x.font='700 '+(12.4*u)+'px Onest, Georgia, serif';x.fillText(lab,50*u,67*u);
  x.font='600 '+(11.2*u)+'px Onest, Georgia, serif';x.fillText('цель',50*u,27*u);
  x.globalCompositeOperation='destination-out';
  let s=99;const R=()=>(s=(s*16807)%2147483647)/2147483647;

}

/* ---------- Ритуал открытия ---------- */
let ritualOn=false,timers=[],rafZip=0;
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const sounded=()=>{const u=navigator.userActivation;return !!(u&&u.hasBeenActive)};
function finishRitual(){
  if(!ritualOn&&!document.body.classList.contains('pre'))return;
  ritualOn=false;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(rafZip);
  document.body.classList.remove('pre','sewing');

function staggerPatches(){
  patchEls.forEach(p=>{p.style.opacity=0;p.style.scale=1.5});

function ritual(){
  const b=document.body;
  if(quiet||MS.params.has('win')){finishRitual();return}
  ritualOn=true;
  const from=clamp(MS.visit.fromRev,0,M.rev),dur=2100;
  setZip(from/goal.rev);tNum.textContent=MS.mln(from);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    b.classList.remove('pre');b.classList.add('sewing');
    MS.count(tNum,from,M.rev,dur,x=>MS.mln(x));
    const t0=performance.now();let lastTooth=-1;
    (function step(t){
      const k=Math.min((t-t0-260)/(dur-260),1);
      if(k>=0){const e=1-Math.pow(1-k,3),rev=lerp(from,M.rev,e);setZip(rev/goal.rev);
        const th=Math.floor(rev/1e6);if(th!==lastTooth){lastTooth=th;if(sounded())MS.sound.tone(2600,.02,{gain:.03,type:'square'})}}
      if(k<1)rafZip=requestAnimationFrame(step);
    })(t0);
    later(()=>{ritualOn=false;b.classList.remove('sewing');patchEls.forEach(p=>{p.style.opacity='';p.style.scale=''})},2900);
  }));
}

function thump(gain){MS.sound.tone(170,.05,{type:'square',gain:gain*.5});MS.sound.noise(.035,{from:3400,to:900,gain:gain,peak:.15})}

async function playWin(){
  if(winBusy)return;winBusy=true;
  await fontsReady;
  finishRitual();
  scrollTo({top:0});
  hideTip();
  const size=Math.round(Math.min(innerWidth*.86,innerHeight*.62,520));
  const hoop=$('#wHoop'),wc=$('#wC'),head=$('#wHead');
  hoop.style.width=hoop.style.height=size+'px';
  const dpr=Math.min(devicePixelRatio||1,2),R=size*dpr;wc.width=wc.height=R;
  const x=wc.getContext('2d');
  /* Полотно в пяльцах */
  const c=R/2,rr=R*.46;
  x.save();x.beginPath();x.arc(c,c,rr,0,7);x.clip();
  const gr=x.createRadialGradient(c*.8,c*.7,R*.05,c,c,R*.55);gr.addColorStop(0,'#6d7847');gr.addColorStop(1,'#394122');x.fillStyle=gr;x.fillRect(0,0,R,R);
  x.strokeStyle='rgba(0,0,0,.09)';x.lineWidth=1;for(let i=0;i<R;i+=3){x.beginPath();x.moveTo(0,i);x.lineTo(R,i);x.stroke()}
  x.restore();
  x.lineWidth=R*.028;x.strokeStyle='#c7a25a';x.beginPath();x.arc(c,c,rr+R*.012,0,7);x.stroke();
  x.lineWidth=R*.006;x.strokeStyle='#6d5222';x.beginPath();x.arc(c,c,rr+R*.028,0,7);x.stroke();x.strokeStyle='#f3deaa';x.beginPath();x.arc(c,c,rr-R*.003,0,7);x.stroke();
  /* Нашивка шьётся настоящими рядами */
  const spec=winSpec(),PW=Math.round(R*.66),ox=(R-PW)/2,oy=(R-PW)/2;
  const runs=planOf(layersFor(spec,PW),PW);
  x.save();x.translate(ox,oy);
  x.save();x.globalAlpha=.42;x.setLineDash([R*.012,R*.012]);x.strokeStyle='#f4efe2';x.lineWidth=R*.004;tracePts(x,perimeter(spec.shape),PW/100);x.stroke();x.restore();
  const N=runs.length;let done=0;
  W.className='on';
  const fl=$('#wFlash'),cap=$('#wCap');
  requestAnimationFrame(()=>W.classList.add('a'));
  MS.sound.rise(1.7);MS.sound.tone(52,3,{gain:.08,type:'sawtooth',attack:.8});
  const t0=performance.now();let nextT=0,stage=0,dead=false;
  const prog=t=>t<1.5?.2*Math.pow(t/1.5,1.4):t<3?.2+.8*Math.pow((t-1.5)/1.5,1.25):1;
  const tick=now=>{
    if(dead)return;
    const t=(now-t0)/1000,goalN=Math.floor(prog(t)*N);
    if(goalN>done){paintRuns(x,runs,done,goalN);done=goalN}
    const r=runs[Math.min(done,N-1)];
    const nx=(ox+r[2])/dpr,ny=(oy+r[3])/dpr,bob=stage?0:(Math.sin(now*.09)*7);
    head.style.transform='translate('+nx.toFixed(1)+'px,'+(ny-5+bob).toFixed(1)+'px)';
    if(t<3&&t>=nextT){const k=Math.min(t/3,1);thump(.035+.09*k);nextT=t+lerp(.24,.05,k*k)}
    if(t>=3&&!stage){stage=1;x.restore();x.save();x.translate(ox,oy);finishLight(x,spec,PW);x.restore();MS.sound.click();head.style.transition='transform .22s ease-in';head.style.transform='translate('+(nx)+'px,-'+(size*.3)+'px)'}
    if(t>=3.22&&stage===1){stage=2;peak()}
    if(stage<2)requestAnimationFrame(tick);
  };
  const peak=()=>{
    MS.sound.boom();MS.sound.win();if(sounded())MS.vibrate([50,40,160]);
    /* Вспышка и бросок нашивки на куртку */
    fl.animate([{opacity:0},{opacity:1,offset:.1},{opacity:0}],{duration:900,easing:'ease-out'});
    W.classList.add('b');$('#jk').classList.add('shake');setTimeout(()=>$('#jk').classList.remove('shake'),520);

    W.appendChild(fly);
    const hr=hoop.getBoundingClientRect(),cx0=hr.left+hr.width/2,cy0=hr.top+hr.height/2;
    const tr=target?target.getBoundingClientRect():{left:cx0,top:cy0,width:FS,height:FS};
    const s1=tr.width/FS,tx=tr.left+tr.width/2-FS/2,ty=tr.top+tr.height/2-FS/2;
    const an=fly.animate([{transform:'translate('+(cx0-FS/2)+'px,'+(cy0-FS/2)+'px) scale(1) rotate(0deg)'},{transform:'translate('+(cx0-FS/2)+'px,'+(cy0-FS/2-20)+'px) scale(1.1) rotate(-5deg)',offset:.3},{transform:'translate('+tx+'px,'+ty+'px) scale('+s1+') rotate(0deg)'}],{duration:640,easing:'cubic-bezier(.6,0,.15,1)',fill:'forwards'});
    an.onfinish=()=>{

      MS.sound.noise(.42,{from:700,to:7000,gain:.14,peak:.8});
      const from=zipT,z0=performance.now();
      (function zipUp(n){const k=Math.min((n-z0)/430,1),e=k*k*(3-2*k);setZip(lerp(from,1,e));links(0);if(k<1)requestAnimationFrame(zipUp)})(z0);

        },1000);

/* Шрифт опоздал: перевышиваем нашивки уже с ним */
fontsLoaded.then(()=>{if(built&&!winBusy&&document.querySelector('.patch')){const late=!firstPaintHadFont;if(late){$('#patches').innerHTML='';$('#coll').innerHTML='';patchEls.length=0;buildPatches()}}});
})();
</script>
