<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#01080a">
<title>Maison Sauvage. Визор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&family=Jura:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&family=Jura:wght@300;400;500;600;700&display=swap"></noscript>
<style>
@property --fold{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --ice:#ecfefb;--ice2:rgba(228,251,248,.88);--ice3:rgba(214,244,241,.82);
  --lime:#c9ff2f;--lime2:rgba(201,255,47,.32);--teal:#49e4d4;--teal2:rgba(73,228,212,.42);
  --ink:#01080a;--P:1000px;--u:1
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--ink);color:var(--ice);font:400 14px/1.35 'Exo 2',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:1px solid var(--lime);outline-offset:3px}
h2{font:500 12px/1.1 'Exo 2',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ice2);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 span{letter-spacing:.04em;text-transform:none;font:500 13px/1 Jura,sans-serif;color:var(--ice3);white-space:nowrap}
.n{font-family:Jura,sans-serif;font-weight:500;font-feature-settings:'lnum' 1,'tnum' 1}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
body.nogl{background:radial-gradient(120% 70% at 50% 118%,#0c5a60 0,#02141a 48%,#01080a 72%)}
#scrim{position:fixed;inset:0;background:#01090b;opacity:0;pointer-events:none}
#sheen{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#sheen i{position:absolute;top:-30%;bottom:-30%;left:-40%;width:26%;transform:skewX(-18deg) translateX(0);background:linear-gradient(90deg,transparent,rgba(214,255,246,.042) 40%,rgba(214,255,246,.075) 50%,rgba(214,255,246,.042) 60%,transparent);animation:sheen 11s cubic-bezier(.5,0,.3,1) infinite}
@keyframes sheen{0%,72%{transform:skewX(-18deg) translateX(0)}100%{transform:skewX(-18deg) translateX(620%)}}

/* метка дома на планете */
#mark{position:fixed;left:0;top:0;z-index:3;pointer-events:none;will-change:transform}
#mark .ring{position:absolute;left:-17px;top:-17px;width:34px;height:34px}
#mark .ring circle{fill:none;stroke:var(--lime);stroke-width:1.2}
#mark .ring path{stroke:var(--lime);stroke-width:1.2;fill:none}
#mark .ring .pp{transform-origin:17px 17px;animation:pp 3.6s ease-out infinite}
@keyframes pp{0%{transform:scale(.4);opacity:.9}70%,100%{transform:scale(1.6);opacity:0}}
#mark .ld{position:absolute;left:12px;top:-1px;width:64px;height:1px;background:linear-gradient(90deg,var(--lime),var(--lime2));transform-origin:0 0;transform:rotate(-14deg)}
#mark .lb{position:absolute;left:80px;top:-34px;white-space:nowrap;line-height:1.25}
#mark .lb b{display:block;font:600 14px/1.15 Jura,sans-serif;color:var(--ice);letter-spacing:.03em}
#mark .lb span{font-size:12px;color:var(--ice2)}

/* сцена */
#view{position:fixed;inset:0;overflow:hidden;z-index:5}
#scale{position:absolute;left:50%;top:50%;width:1440px;height:900px;margin:-450px 0 0 -720px;transform:scale(var(--u))}
#persp{position:absolute;inset:0;perspective:var(--P);perspective-origin:50% 50%}
#hud{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:720px 450px var(--P)}
.sph{--w:300px;--yaw:0deg;--pitch:0deg;--fold:0deg;position:absolute;left:720px;top:450px;width:var(--w);transform-origin:0 0;
  transform:translateZ(var(--P)) rotateY(calc(var(--yaw) + var(--fold))) rotateX(var(--pitch)) translateZ(calc(-1*var(--P))) rotateZ(var(--rz,0deg)) translate(-50%,-50%)}
.mod{padding:14px 16px 14px;background:radial-gradient(130% 120% at 50% 45%,rgba(1,14,17,.6) 30%,rgba(1,14,17,.2) 100%)}
.mod::before{content:'';position:absolute;inset:0;pointer-events:none;--c:rgba(226,252,248,.78);--l:13px;background:
  linear-gradient(var(--c),var(--c)) 0 0/var(--l) 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/1px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/var(--l) 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/1px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/var(--l) 1px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/1px var(--l) no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/var(--l) 1px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/1px var(--l) no-repeat}
.mod::after{content:'';position:absolute;left:16px;right:16px;top:-1px;height:1px;background:linear-gradient(90deg,var(--teal2),transparent 70%);pointer-events:none}
#mC{--yaw:26deg;--pitch:-14.6deg;--rz:-3deg;--w:318px}
#mD{--yaw:26deg;--pitch:-.8deg;--w:318px}
#mG{--yaw:26deg;--pitch:13.4deg;--rz:3deg;--w:318px}
#mI{--yaw:-26deg;--pitch:-15.6deg;--rz:3deg;--w:318px}
#mE{--yaw:-26deg;--pitch:-4.4deg;--rz:1deg;--w:318px}
#mF{--yaw:-26deg;--pitch:5.8deg;--rz:-1deg;--w:318px}
#mJ{--yaw:-26deg;--pitch:14.6deg;--rz:-3deg;--w:318px}
#mH,.grp{display:none}

/* бренд */
#brand{position:absolute;left:0;right:0;top:13px;text-align:center;pointer-events:none}
#brand b{font:600 13px/1 Jura,sans-serif;letter-spacing:.56em;margin-right:-.56em;color:var(--ice)}

/* прицел */
#ret{position:absolute;left:720px;top:366px;width:0;height:0;transform-style:preserve-3d}
#ret .ly{position:absolute;left:0;top:0;pointer-events:none}
#ret svg{position:absolute;overflow:visible;display:block}
#rCrown{transform:translateZ(0)}
#rDays{transform:translateZ(8px)}
#rOrbit{transform:translateZ(14px)}
#rOrbit svg{animation:spin 170s linear infinite;transform-origin:50% 50%}
#rGoal{transform:translateZ(20px)}
#rWave{transform:translateZ(16px)}
#rCenter{transform:translateZ(40px) translateY(-50%);width:340px;margin-left:-170px;text-align:center;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.hit{pointer-events:all;cursor:crosshair;fill:transparent}
.cap{font:500 13px/1 'Exo 2',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ice2)}
.big{font:300 162px/1 Jura,sans-serif;letter-spacing:-.035em;color:var(--ice);font-feature-settings:'lnum' 1;text-shadow:0 0 34px rgba(150,255,235,.22);margin:4px 0 2px}
.unit{display:flex;gap:12px;justify-content:center;align-items:baseline;font:500 21px/1 Jura,sans-serif;color:var(--ice)}
.unit i{width:1px;height:15px;background:var(--ice3);align-self:center}
.sub{margin-top:11px;font:400 13.5px/1.35 'Exo 2',sans-serif;color:var(--ice2)}
.sub b{font-weight:500;color:var(--ice)}
#rOrbit text{font:500 11.5px 'Exo 2',sans-serif;letter-spacing:.11em;fill:rgba(214,246,243,.84)}
.goalArc{transition:stroke-dashoffset 1.5s cubic-bezier(.2,.7,.2,1)}
.flagT{font:600 12.5px Jura,sans-serif;fill:var(--lime);letter-spacing:.04em}
.mLab{font:500 11.5px Jura,sans-serif;fill:rgba(224,250,247,.88)}
.mLab.me{fill:var(--lime);font-weight:700}
.dLab{font:500 11px Jura,sans-serif;fill:rgba(214,246,243,.82)}
.bar-d{transition:opacity .4s}
#rWave i{position:absolute;left:0;top:0;border:1px solid var(--lime);border-radius:50%;opacity:0;animation:wave 9.5s ease-out infinite}
@keyframes wave{0%,78%{transform:scale(.72);opacity:0}80%{opacity:.5}100%{transform:scale(1.14);opacity:0}}

/* цель */
#goal{position:absolute;left:490px;top:607px;width:460px;padding:0 2px}
#goal .r1{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;color:var(--ice2)}
#goal .r1 b{font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
#goal .r2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:3px;font:500 24px/1.1 Jura,sans-serif;white-space:nowrap}
#goal .r2 em{font-style:normal;color:var(--lime)}
#goal .bar{position:relative;height:5px;margin-top:7px;background:rgba(214,246,243,.2)}
#goal .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--lime);box-shadow:0 0 12px rgba(201,255,47,.55);transition:width 1.5s cubic-bezier(.2,.7,.2,1)}
#goal .bar u{position:absolute;right:0;top:-3px;bottom:-3px;width:1px;background:var(--ice)}
#goal .bar s{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ice2)}
#trail{display:none;position:absolute;left:0;right:0;top:-1px}
.trailed #trailTag{display:inline-flex}
#trailTag{display:none;align-items:center;gap:7px;font:600 13px/1 Jura,sans-serif;color:var(--lime)}
#trailTag svg{width:16px;height:16px}

/* находка */
#ins{position:absolute;left:478px;top:814px;width:484px;min-height:62px;text-align:center;padding:6px 10px;display:block}
#ins .t{display:block;font:500 11.5px/1 'Exo 2',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
#ins .x{display:block;font:400 16px/1.28 'Exo 2',sans-serif;color:var(--ice);text-shadow:0 1px 6px rgba(0,0,0,.9)}
#ins .x.in{animation:insIn .5s ease-out}
@keyframes insIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* кнопки */
#act{position:absolute;right:30px;bottom:15px;display:flex;gap:10px;align-items:center}
#btnWin,#phWin{height:48px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;background:var(--lime);color:#071005;font:700 15px/1 Jura,sans-serif;letter-spacing:.03em;box-shadow:0 0 22px rgba(201,255,47,.3);transition:box-shadow .3s,transform .15s}
#phWin{display:none}
#btnWin:hover,#phWin:hover{box-shadow:0 0 34px rgba(201,255,47,.6)}
#btnWin:active,#phWin:active{transform:scale(.97)}
#btnColl{height:48px;padding:0 12px;white-space:nowrap;display:inline-flex;align-items:center;gap:10px;font:500 14px/1.1 Jura,sans-serif;color:var(--ice);border:1px solid rgba(226,252,248,.5);background:rgba(1,14,17,.5)}
#btnColl:hover{border-color:var(--ice)}
#btnColl svg{width:76px;height:18px;display:block}
#btnColl b{font-weight:700}

/* модули */
.rep{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.rep .n{font-size:42px;line-height:1;font-weight:400}
.rep span{font:500 16px/1 Jura,sans-serif}
.rep em{margin-left:auto;font-style:normal;font-size:12.5px;line-height:1.15;color:var(--lime);text-align:right;max-width:112px}
.kv{display:flex;gap:18px;margin-top:9px}
.kv div{display:flex;align-items:baseline;gap:6px;font-size:13.5px;color:var(--ice2)}
.kv b{font:600 21px/1 Jura,sans-serif;color:var(--ice)}
.rl{margin-top:8px;padding-top:7px;border-top:1px solid rgba(226,252,248,.17);font-size:13px;line-height:1.3;color:var(--ice2)}
.rl b{font-weight:500;color:var(--ice)}
.eng{margin-top:11px}
.eng .h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.eng .h span{font-size:13.5px;color:var(--ice2)}
.eng .h b{font:500 25px/1 Jura,sans-serif;font-feature-settings:'lnum' 1;white-space:nowrap}
.eng .h small{font:500 15px/1 Jura,sans-serif}
.tape{position:relative;height:10px;margin-top:5px;background:repeating-linear-gradient(90deg,var(--teal2) 0 2px,transparent 2px 6px)}
.tape i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v)*100%);background:repeating-linear-gradient(90deg,var(--lime) 0 2px,transparent 2px 6px);transition:width 1.6s cubic-bezier(.2,.7,.2,1) .4s}
.tape u{position:absolute;right:0;top:-3px;bottom:-3px;width:1px;background:var(--ice)}
.eng .j{display:flex;justify-content:flex-end;margin-top:3px;font-size:12px;color:var(--ice2)}
.why{display:flex;align-items:baseline;gap:9px;margin-top:9px}
.why .n{font-size:42px;line-height:1;font-weight:400;color:var(--lime)}
.why p{font-size:14px;line-height:1.2;color:var(--ice)}
.cells{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:9px;height:15px}
.cells i{display:block;background:rgba(214,246,243,.14);cursor:crosshair}
.cells i.on{background:var(--lime)}
.note{margin-top:7px;font-size:12.5px;line-height:1.28;color:var(--ice2)}
.tasks{margin-top:5px}
.task{display:flex;align-items:center;gap:11px;width:100%;min-height:47px;padding:3px 0;position:relative}
.task+.task{border-top:1px solid rgba(226,252,248,.13)}
.ck{flex:0 0 26px;height:26px;border:1.5px solid var(--ice2);border-radius:50%;position:relative;transition:background .2s,border-color .2s}
.ck svg{position:absolute;inset:4px;width:15px;height:15px;stroke:#071005;stroke-width:2.6;fill:none;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s .05s}
.task.done .ck{background:var(--lime);border-color:var(--lime)}
.task.done .ck svg{stroke-dashoffset:0}
.ck::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--lime);opacity:0;pointer-events:none}
.task.flash .ck::after{animation:ckf .7s ease-out}
@keyframes ckf{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(3.2)}}
.task .tx{flex:1;font-size:14px;line-height:1.22;color:var(--ice)}
.task .tg{flex:0 0 auto;font-size:12px;color:var(--ice3)}
.task.done .tx{color:var(--ice3)}
.rent{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:9px}
.rent .n{font-size:30px;line-height:1;font-weight:400}
.rent .n small{font-size:16px;font-weight:500}
.rent p{text-align:right;font-size:13.5px;line-height:1.2;color:var(--ice)}
.rent p em{display:block;font-style:normal;color:var(--ice2);font-size:12.5px}
.paid{position:relative;height:6px;margin-top:9px;background:rgba(214,246,243,.2)}
.paid i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v)*100%);background:var(--ice);transition:width 1.6s cubic-bezier(.2,.7,.2,1) .5s}
.brs{display:flex;gap:14px;margin-top:9px}
.brs div{font-size:12.5px;line-height:1.15;color:var(--ice2)}
.brs b{display:block;font:500 26px/1 Jura,sans-serif;color:var(--ice);margin-bottom:2px}
.tops{margin-top:8px}
.tops div{display:grid;grid-template-columns:92px 1fr 26px;align-items:center;gap:8px;height:21px;font:500 13px/1 Jura,sans-serif;letter-spacing:.04em}
.tops i{display:block;height:3px;background:rgba(214,246,243,.16);position:relative}
.tops i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:calc(var(--v)*100%);background:var(--ice)}
.tops div:first-child i::after{background:var(--lime)}
.tops b{text-align:right}
.inv{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.inv .n{font-size:30px;line-height:1;font-weight:400}
.inv span{font:500 16px/1 Jura,sans-serif;color:var(--ice)}
.track0{position:relative;height:6px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--teal2) 0 1px,transparent 1px 9px)}
.track0 i{position:absolute;left:0;top:-3px;bottom:-3px;width:2px;background:var(--lime)}

/* коллекция */
#mK{display:none;position:absolute;inset:0;transform-style:preserve-3d;z-index:20}
.coll #mK{display:block}
#kHead{position:absolute;left:300px;width:840px;top:38px;text-align:center}
#kHead .a{font:300 40px/1.1 Jura,sans-serif}
#kHead .a b{font-weight:500;color:var(--lime)}
#kHead .b{margin-top:6px;font-size:14px;color:var(--ice2)}
#kClose{position:absolute;right:210px;top:44px;height:44px;padding:0 16px;display:inline-flex;align-items:center;border:1px solid rgba(226,252,248,.55);font:600 14px/1 Jura,sans-serif;background:rgba(1,14,17,.6)}
.tok{--w:196px;text-align:center;padding:4px 4px 8px}
.tok svg{width:92px;height:92px;display:block;margin:0 auto 5px;overflow:visible}
.tok .a{font:400 13px/1.15 'Exo 2',sans-serif;color:var(--ice2)}
.tok .b{font:600 19px/1.15 Jura,sans-serif;color:var(--ice);margin-top:3px}
.tok .c{font-size:12px;line-height:1.2;color:var(--ice3);margin-top:2px}
.tok.off .b{color:var(--ice2)}
.tok.new .b{color:var(--lime)}
.coll #scrim{opacity:.66!important}
.coll .mod:not(#mK),.coll #ret,.coll #goal,.coll #ins,.coll #act,.coll #mark{opacity:0!important;visibility:hidden}

/* подсказка */
#tip{position:fixed;left:0;top:0;z-index:60;max-width:270px;padding:8px 11px;background:rgba(1,12,15,.94);border:1px solid rgba(226,252,248,.5);font-size:13px;line-height:1.3;color:var(--ice);pointer-events:none;visibility:hidden}
#tip.on{visibility:visible}
#tip b{display:block;font:600 14px/1.2 Jura,sans-serif;color:var(--lime);margin-bottom:2px}

/* победа */
#after{position:fixed;left:50%;top:50%;width:min(680px,92vw);transform:translate(-50%,-50%);z-index:30;text-align:center;visibility:hidden;opacity:0;transition:opacity .9s .15s;pointer-events:none;text-shadow:0 2px 18px rgba(0,8,10,.75)}
#after .t0{font:500 13px/1 'Exo 2',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--lime)}
#after .t1{font:300 clamp(46px,8vw,92px)/1.04 Jura,sans-serif;letter-spacing:-.02em;margin-top:12px}
#after .t2{font:500 clamp(24px,3.4vw,38px)/1.1 Jura,sans-serif;color:var(--lime);margin-top:12px}
#after .t2 span{color:var(--ice);margin-left:10px;font-size:.62em}
#after .t3{font:400 17px/1.3 'Exo 2',sans-serif;color:var(--ice);margin-top:14px}
#after .t4{font:400 13px/1.3 'Exo 2',sans-serif;color:var(--ice2);margin-top:18px}
#after::before{content:'';position:absolute;inset:-70px -110px;z-index:-1;background:radial-gradient(closest-side,rgba(1,10,12,.66),rgba(1,10,12,.36) 62%,transparent)}
.w3 #after{visibility:visible;opacity:1}
.mod,#goal,#ins,#act,#brand,#ret,#mark{transition:opacity .6s}
.mod{transition:opacity .7s,--fold 1.3s cubic-bezier(.5,0,.2,1)}
.w1 .mod{opacity:0;pointer-events:none}
.w1 #mC,.w1 #mD,.w1 #mG{--fold:13deg}
.w1 #mI,.w1 #mE,.w1 #mF,.w1 #mJ{--fold:-13deg}
.w1 #goal,.w1 #ins,.w1 #act,.w1 #brand,.w1 #mark{opacity:0;pointer-events:none}
.w2 #ret{opacity:0;transition:opacity .35s}
.w1 #rCenter .big{color:var(--lime)}
.w3{cursor:pointer}

/* ритуал открытия */
.boot .mod,.boot #goal,.boot #ins,.boot #act,.boot #brand,.boot #mark{opacity:0}
.boot #mC,.boot #mD,.boot #mG{--fold:11deg}
.boot #mI,.boot #mE,.boot #mF,.boot #mJ{--fold:-11deg}
.boot #ret{opacity:0}
.go #ret{opacity:1;transition:opacity .9s}
.go .mod{opacity:1;transition:opacity .9s var(--dl,.8s),--fold 1.4s cubic-bezier(.16,.8,.24,1) var(--dl,.8s)}
.go #mD,.go #mE{--dl:1s}.go #mG,.go #mF{--dl:1.2s}.go #mJ{--dl:1.35s}
.fast .mod{--dl:0s!important;transition-duration:.25s!important}
.fast .dd,.fast .cc{transition-delay:0s!important}
.go #goal{opacity:1;transition:opacity .8s 1.1s}
.fast.go #goal,.fast.go #ins,.fast.go #act,.fast.go #brand,.fast.go #mark{transition-delay:.1s}
.go #ins,.go #act,.go #brand,.go #mark{opacity:1;transition:opacity .9s 1.7s}
.bar-d{animation:none}
.boot .dd,.boot .cc{opacity:0}
.go .dd,.go .cc{opacity:1;transition:opacity .35s calc(var(--i)*38ms + .25s)}

/* телефон и всё узкое */
@media (max-width:900px),(max-aspect-ratio:1/1),(max-height:560px){
  html,body{overflow-x:hidden}
  #view,#scale,#persp,#hud{position:relative;inset:auto;width:auto;height:auto;margin:0;transform:none;overflow:visible;perspective:none;left:auto;top:auto}
  #view{z-index:5}
  #hud{padding:0 12px calc(78px + env(safe-area-inset-bottom));transform-style:flat}
  .sph,.mod{position:relative;left:auto;top:auto;width:auto;transform:none;--fold:0deg}
  #brand{position:relative;top:auto;padding-top:calc(13px + env(safe-area-inset-top));height:calc(32px + env(safe-area-inset-top))}
  #brand b{font-size:12px;letter-spacing:.46em}
  #ret{position:relative;left:auto;top:auto;width:100%;height:var(--S,372px);transform-style:flat;margin-top:2px}
  #ret .ly{left:50%;top:50%}
  #rCrown,#rDays,#rOrbit,#rGoal,#rWave{transform:none}
  #rCenter{transform:translateY(-50%);width:216px;margin-left:-108px}
  .cap{font-size:11.5px;letter-spacing:.16em}
  .big{font-size:86px;margin:3px 0 1px}
  .unit{font-size:15px;gap:8px}
  .unit i{height:12px}
  #rCenter .sub{display:none}
  #goal{position:relative;left:auto;top:auto;width:auto;padding:0 4px;margin-top:-34px}
  #goal .r2{font-size:24px;flex-wrap:wrap;white-space:normal;gap:0 12px}
  #goal .r1 span{font-size:12.5px}
  #gSub{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--ice2)}
  #gSub b{font-weight:500;color:var(--ice)}
  #gap1{min-height:calc(100dvh - var(--S,372px) - 150px)}
  #phWin{display:flex;width:100%;height:54px;margin-top:12px}
  #ins{position:relative;left:auto;top:auto;width:auto;min-height:92px;text-align:left;padding:14px 16px;background:rgba(1,14,17,.5);margin-top:12px}
  #ins .x{font-size:16px}
  .grp{display:block;margin:34px 4px 10px;font:300 26px/1.1 Jura,sans-serif;color:var(--ice)}
  .grp b{font-weight:500;color:var(--lime)}
  .mod{margin-top:12px;background:rgba(1,14,17,.56);padding:15px 16px 15px;will-change:transform}
  #mH{display:block}
  .task{min-height:52px}
  #act{display:none}
  #btnWin{width:100%;height:54px}
  #btnColl{display:none}
  #mK{display:block;position:relative;inset:auto;transform-style:flat;margin-top:8px}
  #kHead{position:relative;left:auto;top:auto;width:auto;text-align:left;padding:0 4px}
  #kHead .a{display:none}
  #kHead .b{margin:0}
  #kClose{display:none}
  #kGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .tok{--w:auto;background:rgba(1,14,17,.5);padding:10px 8px 12px}
  #mark .lb{left:-8px;top:24px}
  #mark .ld{display:none}
  #after .t3{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  #sheen,#rWave{display:none}
  #rOrbit svg,#mark .pp{animation:none}
  .mod,#goal,#ins,#act,#brand,#ret,#mark{transition:none!important}
  .goalArc,.tape i,.paid i,#goal .bar i{transition:none}
}
</style>
</head>
<body class="boot">
<canvas id="gl" aria-hidden="true"></canvas>
<div id="scrim"></div>
<div id="sheen" aria-hidden="true"><i></i></div>
<div id="mark" aria-hidden="true">
  <svg class="ring" viewBox="0 0 34 34"><circle class="pp" cx="17" cy="17" r="11"/><circle cx="17" cy="17" r="5"/><path d="M17 3v7M17 24v7M3 17h7M24 17h7"/></svg>
  <span class="ld"></span>
  <span class="lb"><b id="mkA"></b><span id="mkB"></span></span>
</div>
<main id="view"><div id="scale"><div id="persp"><div id="hud">
  <header id="brand"><b>MAISON SAUVAGE</b></header>

  <section id="ret" aria-label="Выручка месяца и прогресс к цели">
    <div class="ly" id="rWave"><i></i></div>
    <div class="ly" id="rCrown"></div>
    <div class="ly" id="rDays"></div>
    <div class="ly" id="rOrbit"></div>
    <div class="ly" id="rGoal"></div>
    <div class="ly" id="rCenter">
      <div class="cap" id="vCap"></div>
      <div class="big" id="vRev"></div>
      <div class="unit"><span>млн Rp</span><i></i><span id="vUsd"></span></div>
      <div class="sub" id="vSub"></div>
    </div>
  </section>

  <section id="goal" aria-label="Следующая цель">
    <div class="r1"><b>Следующая цель</b><span id="gThen"></span></div>
    <div class="r2"><span id="gName"></span><em id="gLeft"></em></div>
    <div class="bar"><i id="gBar"></i><s id="gFc"></s><u></u></div>
    <div id="gSub" style="display:none"></div>
  </section>

  <div id="gap1"></div>

  <div class="grp">Что сделать сегодня</div>
  <section class="mod sph" id="mI"></section>
  <button id="ins" class="" aria-label="Находка дня, нажми для следующей"><span class="t">Находка дня</span><span class="x" id="insT"></span></button>
  <button id="phWin">Показать победу</button>

  <div class="grp">Что было вчера</div>
  <section class="mod sph" id="mC"></section>
  <section class="mod sph" id="mG"></section>

  <div class="grp">Что двигает выручку</div>
  <section class="mod sph" id="mD"></section>
  <section class="mod sph" id="mH"></section>

  <div class="grp">Деньги</div>
  <section class="mod sph" id="mE"></section>
  <section class="mod sph" id="mJ"></section>

  <div class="grp">Бренды</div>
  <section class="mod sph" id="mF"></section>

  <div class="grp">Коллекция <b id="kCount2"></b></div>
  <section id="mK" aria-label="Рекорды и достижения">
    <div id="kHead"><div class="a">Коллекция <b id="kCount"></b></div><div class="b" id="kRec"></div></div>
    <button id="kClose">Закрыть</button>
    <div id="kGrid"></div>
  </section>

  <div id="act">
    <button id="btnColl" aria-label="Открыть рекорды и достижения"><span id="kDots"></span><span>Коллекция <b id="kCount3"></b></span></button>
    <button id="btnWin">Показать победу</button>
  </div>
</div></div></div></main>

<div id="after" role="status" aria-live="polite">
  <div class="t0">Новая система за стеклом</div>
  <div class="t1" id="aT"></div>
  <div class="t2"><b id="aV" style="font-weight:500"></b><span id="aU"></span></div>
  <div class="t3" id="aS"></div>
  <div class="t4">Нажми, чтобы вернуться к приборам</div>
</div>
<div id="tip" role="tooltip"></div>

<script src="../data.js"></script>
<script src="../core.js"></script>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';

const MS = window.MS, D = MS.data, NB = ' ';
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const QUERY = '(max-width:900px),(max-aspect-ratio:1/1),(max-height:560px)';
const isPhone = () => matchMedia(QUERY).matches;
const NOW = D.month, body = document.body;
const low = s => s.charAt(0).toLowerCase() + s.slice(1);

/* ---------- цель и след победы ---------- */
const WIN_KEY = 'ms_vizor_win';
let trail = false;
try { trail = sessionStorage.getItem(WIN_KEY) === '1'; } catch (e) {}
const stepName = s => /^m\d{4}-\d{2}$/.test(s.id) ? MS.monthName(s.id.slice(1)) : s.label;
const stepMonth = s => /^m\d{4}-\d{2}$/.test(s.id) ? MS.monthShort(s.id.slice(1)) : '';
function goalNow() {
  const i = trail ? 1 : 0, g = D.next[i], n = D.next[i + 1];
  return { step: g, then: n, name: stepName(g), left: Math.max(g.rev - NOW.rev, 0), progress: Math.min(NOW.rev / g.rev, 1) };
}

/* ---------- прицел ---------- */
const P2 = (r, a) => [r * Math.sin(a), -r * Math.cos(a)];
const f1 = x => x.toFixed(1);
const rad = d => d * Math.PI / 180;
function sector(r0, r1, a0, a1) {
  const [x0, y0] = P2(r0, a0), [x1, y1] = P2(r1, a0), [x2, y2] = P2(r1, a1), [x3, y3] = P2(r0, a1);
  return `M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}A${r1} ${r1} 0 0 1 ${f1(x2)} ${f1(y2)}L${f1(x3)} ${f1(y3)}A${r0} ${r0} 0 0 0 ${f1(x0)} ${f1(y0)}Z`;
}
const arcP = (r, a0, a1) => { const [x0, y0] = P2(r, a0), [x1, y1] = P2(r, a1); return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 0 1 ${f1(x1)} ${f1(y1)}`; };
const svg = (S, inner) => `<svg width="${S}" height="${S}" viewBox="${-S / 2} ${-S / 2} ${S} ${S}" style="left:${-S / 2}px;top:${-S / 2}px" aria-hidden="true">${inner}</svg>`;

function dayTip(x) {
  const t = x.rev > 0 ? `Выручка ${MS.rp(x.rev)} (${MS.usd(x.rev)})` : 'Тихий день, продаж нет';
  return `<b>${MS.date(x.d)}</b>${t}<br>Зашли ${x.came}, купили ${x.buy}`;
}
function monthTip(m) {
  const cur = m.m === NOW.key;
  return `<b>${MS.monthName(m.m)}${cur ? ', идёт' : ''}</b>Выручка ${MS.rp(m.rev)} (${MS.usd(m.rev)})<br>Зашли в день ${MS.comma(m.perDay, 1)}, покупают ${MS.pct(m.conv)}<br>Средний чек ${MS.rp(m.check)}`;
}
function buildRet() {
  const ph = isPhone();
  const S = ph ? Math.min(innerWidth - 16, 386) : 680;
  document.documentElement.style.setProperty('--S', S + 'px');
  const k = S / 386;
  const L = ph
    ? { goal: 112 * k, gw: 7, ob: 120 * k, dIn: 131 * k, dMax: 20 * k, cIn: 154 * k, cMax: 30 * k, dayW: 7.6, monW: 11 }
    : { goal: 184, gw: 9, ob: 197, dIn: 216, dMax: 30, cIn: 256, cMax: 64, dayW: 6.4, monW: 10.5 };

  /* венец: 13 месяцев, одна ось, риска через каждые 50 млн Rp */
  const maxM = Math.max(...D.months.map(m => m.rev));
  const g = goalNow();
  const goalM = g.step.id.slice(1);
  let cr = '', hit = '';
  D.months.forEach((m, i) => {
    const a = rad(-90 + i * 15), w = rad(L.monW) / 2, len = Math.max(L.cMax * m.rev / maxM, 3);
    const me = m.m === NOW.key, tg = m.m === goalM, won = trail && m.m === D.next[0].id.slice(1);
    const st = me ? '#c9ff2f' : tg || won ? '#c9ff2f' : 'rgba(226,252,248,.72)';
    const fi = me ? '#c9ff2f' : won ? 'rgba(201,255,47,.5)' : tg ? 'rgba(201,255,47,.14)' : 'rgba(73,228,212,.14)';
    cr += `<path class="cc" style="--i:${i}" d="${sector(L.cIn, L.cIn + len, a - w, a + w)}" fill="${fi}" stroke="${st}" stroke-width="${tg ? 1.4 : 1}"/>`;
    for (let v = 5e7; v < m.rev; v += 5e7) { const r = L.cIn + L.cMax * v / maxM; cr += `<path class="cc" style="--i:${i}" d="${arcP(r, a - w, a + w)}" fill="none" stroke="${st}" stroke-width=".7" opacity=".55"/>`; }
    if (!ph) {
      const [x, y] = P2(L.cIn + len + 11, a);
      const lab = MS.monthShort(m.m) + ' ' + Math.round(m.rev / 1e6);
      cr += `<text class="mLab${me ? ' me' : ''} cc" style="--i:${i}" text-anchor="middle" dominant-baseline="central" transform="translate(${f1(x)} ${f1(y)}) rotate(${(-90 + i * 15)})">${lab}</text>`;
    }
    hit += `<path class="hit" data-tip="${monthTip(m).replace(/"/g, '&quot;')}" d="${sector(L.cIn - 2, L.cIn + Math.max(len, 20) + 22, a - rad(7.4), a + rad(7.4))}"/>`;
  });
  $('#rCrown').innerHTML = svg(S, cr + hit);

  /* кольцо дней */
  const step = 360 / NOW.days, maxD = Math.max(...D.days.map(x => x.rev));
  let dy = '', hd = '';
  for (let i = 0; i < NOW.days; i++) {
    const x = D.days[i], a = rad((i + .5) * step), w = rad(L.dayW) / 2;
    if (x) {
      const today = x.d === D.report.d;
      if (x.rev > 0) {
        const len = Math.max(L.dMax * x.rev / maxD, 3);
        dy += `<path class="dd" style="--i:${i}" d="${sector(L.dIn, L.dIn + len, a - w, a + w)}" fill="${today ? '#c9ff2f' : 'rgba(236,254,251,.9)'}"/>`;
      } else {
        const [px, py] = P2(L.dIn + 2.5, a);
        dy += `<circle class="dd" style="--i:${i}" cx="${f1(px)}" cy="${f1(py)}" r="2.2" fill="none" stroke="#49e4d4" stroke-width="1"/>`;
      }
      hd += `<path class="hit" data-tip="${dayTip(x).replace(/"/g, '&quot;')}" d="${sector(L.dIn - 5, L.dIn + L.dMax + 4, a - rad(step / 2), a + rad(step / 2))}"/>`;
    } else {
      dy += `<path class="dd" style="--i:${i}" d="${sector(L.dIn, L.dIn + 8, a - w, a + w)}" fill="none" stroke="#c9ff2f" stroke-width="1" stroke-dasharray="2 2"/>`;
      hd += `<path class="hit" data-tip="&lt;b&gt;${i + 1} октября&lt;/b&gt;Этот день впереди" d="${sector(L.dIn - 5, L.dIn + L.dMax + 4, a - rad(step / 2), a + rad(step / 2))}"/>`;
    }
    if (!ph && [10, 20].includes(i + 1) && (i + 1) > 3 && (i + 1) < 29 && a > rad(95) && a < rad(265)) {
      const [lx, ly] = P2(L.dIn + L.dMax + 7, a);
      dy += `<text class="dLab dd" style="--i:${i}" text-anchor="middle" dominant-baseline="central" x="${f1(lx)}" y="${f1(ly)}">${i + 1}</text>`;
    }
  }
  $('#rDays').innerHTML = svg(S, dy + hd);

  /* кольцо с настоящими итогами, медленно вращается */
  const T = D.totals;
  const ot = `С ОТКРЫТИЯ ${MS.num(T.items)} ВЕЩЕЙ · ${MS.comma(T.rev / 1e9, 2)} млрд Rp · ${MS.num(T.buy)} ПОКУПОК · ${MS.num(T.came)} ГОСТЕЙ · ЯРКИХ ЗВЁЗД ЗА СТЕКЛОМ ${MS.num(T.items)}, ПО ОДНОЙ НА ПРОДАННУЮ ВЕЩЬ · `;
  const c = 2 * Math.PI * L.ob;
  $('#rOrbit').innerHTML = ph ? '' : svg(S, `<defs><path id="otp" d="M0 ${-L.ob}A${L.ob} ${L.ob} 0 1 1 -.01 ${-L.ob}"/></defs><text><textPath href="#otp" textLength="${f1(c - 6)}" lengthAdjust="spacing">${ot}</textPath></text>`);

  /* кольцо цели: круг замкнётся на следующей ступени, риска 10 млн Rp */
  let gl = `<circle r="${L.goal}" fill="none" stroke="rgba(226,252,248,.34)" stroke-width="1"/>`;
  for (let v = 1e7; v < g.step.rev; v += 1e7) {
    const a = 2 * Math.PI * v / g.step.rev, [x0, y0] = P2(L.goal + L.gw / 2 + 1, a), [x1, y1] = P2(L.goal + L.gw / 2 + 6, a);
    gl += `<path d="M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}" stroke="rgba(226,252,248,.7)" stroke-width="1"/>`;
  }
  gl += `<circle class="goalArc" id="arc" r="${L.goal}" fill="none" stroke="#c9ff2f" stroke-width="${L.gw}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${body.classList.contains('boot') && !body.classList.contains('go') ? 100 : 100 - g.progress * 100}" transform="rotate(-90)" style="filter:drop-shadow(0 0 7px rgba(201,255,47,.55))"/>`;
  const fa = 2 * Math.PI * Math.min(NOW.forecast / g.step.rev, 1), [fx, fy] = P2(L.goal - L.gw / 2 - 2, fa), [gx, gy] = P2(L.goal + L.gw / 2 + 2, fa);
  gl += `<path d="M${f1(fx)} ${f1(fy)}L${f1(gx)} ${f1(gy)}" stroke="#ecfefb" stroke-width="2"/>`;
  const [t0x, t0y] = P2(L.goal - L.gw - 3, 0), [t1x, t1y] = P2(L.goal + L.gw, 0);
  gl += `<path d="M${t0x} ${t0y}L${t1x} ${t1y}" stroke="#ecfefb" stroke-width="2"/>`;
  if (!ph) {
    gl += `<text class="flagT" text-anchor="middle" y="${-L.goal + 23}">${stepMonth(g.step)} ${MS.mln(g.step.rev)}</text>`;
    /* попадание по самому кольцу */
    gl += `<circle class="hit" r="${L.goal}" fill="none" stroke="transparent" stroke-width="22" style="fill:none;pointer-events:stroke" data-tip="${`<b>Кольцо цели</b>${MS.rp(NOW.rev)} из ${MS.rp(g.step.rev)}, это ${MS.pct(g.progress)}. Риска каждые 10 млн Rp. Белая метка: прогноз ${MS.rp(NOW.forecast)}`.replace(/"/g, '&quot;')}"/>`;
  }
  $('#rGoal').innerHTML = svg(S, gl);

  const wv = $('#rWave i'), W = 2 * (L.goal + 8);
  wv.style.cssText = `width:${W}px;height:${W}px;margin:${-W / 2}px 0 0 ${-W / 2}px`;
}

/* ---------- модули ---------- */
const moneyMln = rp => [MS.mln(rp), 'млн' + NB + 'Rp'];
function renderGoal() {
  const g = goalNow();
  $('#gName').textContent = g.name;
  $('#gLeft').textContent = 'осталось ' + MS.rp(g.left);
  $('#gThen').textContent = 'потом ' + low(stepName(g.then)).replace(/ \d{4}$/, '') + ', ' + MS.rp(g.then.rev);
  $('#gBar').style.width = (g.progress * 100) + '%';
  $('#gFc').style.left = Math.min(NOW.forecast / g.step.rev * 100, 100) + '%';
  $('#gFc').title = 'Прогноз ' + MS.rp(NOW.forecast);
  $('#gSub').innerHTML = `<span>День <b>${NOW.day} из ${NOW.days}</b></span><span>Прогноз <b>${MS.rp(NOW.forecast)}</b></span><span><b>${MS.pct(g.progress)}</b></span>`;
  $('#gSub').style.display = isPhone() ? 'flex' : 'none';
  const arc = $('#arc');
  if (arc && !body.classList.contains('boot')) arc.setAttribute('stroke-dashoffset', 100 - g.progress * 100);
  body.classList.toggle('trailed', trail);
}
function renderCenter() {
  $('#vCap').textContent = 'Выручка месяца';
  $('#vSub').innerHTML = `День <b>${NOW.day} из ${NOW.days}</b> · прогноз <b>${MS.rp(NOW.forecast)}</b>`;
}
function renderMods() {
  const r = D.report, sold = r.sold, first = sold[0];
  $('#mC').innerHTML = `<h2>Последний отчёт <span>${MS.date(r.d)}</span></h2>
    <div class="rep"><b class="n">${MS.mln(r.rev)}</b><span>млн Rp</span>${r.bestSince ? `<em>лучший день с ${MS.date(r.bestSince)}</em>` : ''}</div>
    <div class="kv"><div><b>${r.came}</b>зашли</div><div><b>${r.buy}</b>купили</div><div><b>${sold.length}</b>${MS.plural(sold.length, 'вещь', 'вещи', 'вещей')}</div></div>
    <p class="rl"><b>${MS.visit.text}</b><br>${first}${sold.length > 1 ? ' и ещё ' + (sold.length - 1) : ''}</p>`;

  const E = D.engines, mm = x => MS.comma(x, 1);
  const eng = (lab, now, jan, nowS, janS) => `<div class="eng"><div class="h"><span>${lab}</span><b>${nowS}</b></div><div class="tape" style="--v:${clamp(now / jan)}"><i></i><u></u></div><div class="j">январь ${janS}</div></div>`;
  $('#mD').innerHTML = `<h2>Три двигателя выручки</h2>
    ${eng('Зашли в день', E.came.now, E.came.jan, mm(E.came.now), mm(E.came.jan))}
    ${eng('Покупают', E.conv.now, E.conv.jan, MS.pct(E.conv.now), MS.pct(E.conv.jan))}
    ${eng('Средний чек', E.check.now, E.check.jan, `${MS.mln(E.check.now)}${NB}<small>млн Rp</small>`, MS.rp(E.check.jan))}`;

  const W = D.why, days30 = D.days.slice(-W.of);
  const cells = days30.map(x => {
    const on = x.why.includes('нет размера');
    return `<i class="${on ? 'on' : ''}" data-tip="<b>${MS.date(x.d)}</b>${on ? 'Звучало «нет размера»' : 'Про размер не говорили'}"></i>`;
  }).join('');
  $('#mG').innerHTML = `<h2>Почему не купили</h2>
    <div class="why"><b class="n">${W.noSizeDays}</b><p>${MS.plural(W.noSizeDays, 'день', 'дня', 'дней')} из ${W.of} звучало<br><b style="font-weight:500">«нет размера»</b></p></div>
    <div class="cells" aria-hidden="true">${cells}</div>
    <p class="note">Главный рычаг продаж. Гость уже зашёл и хотел купить.</p>`;

  renderTasks();

  const R = MS.rentNext, dl = R.daysLeft;
  const when = dl === 0 ? 'сегодня' : 'через ' + MS.daysWord(dl);
  const sch = D.rent.schedule;
  $('#mE').innerHTML = `<h2>Аренда <span>оплачено ${D.rent.paidPct}%</span></h2>

    s += `<g transform="rotate(${rot})"><ellipse rx="${rx}" ry="${f1(ry)}" fill="none" stroke="${got ? ice : tl}" stroke-width="${got ? .9 : 1}" ${got ? '' : 'stroke-dasharray="2.5 3"'} opacity="${got ? .8 : .9}"/><circle cx="${f1(px)}" cy="${f1(py)}" r="${got ? 2.2 + k * .8 : 2}" fill="${got ? (k === 0 ? lm : ice) : 'none'}" stroke="${got ? 'none' : tl}"/></g>`;
  }
  const core = got ? `<circle r="10" fill="${lm}" opacity=".16"/><circle r="4.5" fill="${fresh ? lm : ice}"/>` : `<circle r="4" fill="none" stroke="${tl}"/>`;
  const prog = !got && a.progress != null ? `<circle r="45" fill="none" stroke="rgba(214,246,243,.22)" stroke-width="2"/><circle r="45" fill="none" stroke="${lm}" stroke-width="2.4" pathLength="100" stroke-dasharray="${a.progress * 100} 100" transform="rotate(-90)"/>` : (got ? `<circle r="45" fill="none" stroke="${ice}" stroke-width=".8" opacity=".45"/>` : '');

let bootDone = false, skipCount = null, glReady = false, pendingWin = false;
function startIntro() {
  const t0 = performance.now(), d = clamp(3800 - t0, 500, 2600);
  (function ramp() {
    if (bootDone) { S.intro = 1; return; }
    S.intro = clamp((performance.now() - t0) / d);
    if (S.intro < 1) requestAnimationFrame(ramp);
  })();
}
function boot() {
  const rev = $('#vRev'), usd = $('#vUsd');
  const from = MS.visit.fromRev, to = NOW.rev;
  const fm = x => MS.mln(x), fu = x => MS.num(x / D.rate) + NB + '$';
  if (MS.calm) { rev.textContent = fm(to); usd.textContent = fu(to); finishBoot(); return; }
  const dur = clamp(3600 - performance.now(), 700, 2800);
  if (dur < 2000) body.classList.add('fast');
  let live = true;
  const px = el => ({ set textContent(v) { if (live) el.textContent = v; } });
  rev.textContent = fm(from); usd.textContent = fu(from);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (bootDone) return;
    body.classList.add('go');
    MS.count(px(rev), from, to, dur * .82, fm); MS.count(px(usd), from, to, dur * .82, fu);
    const arc = $('#arc'); if (arc) arc.setAttribute('stroke-dashoffset', 100 - goalNow().progress * 100);
  }));
  skipCount = () => { live = false; rev.textContent = fm(to); usd.textContent = fu(to); };
  setTimeout(finishBoot, dur + 80);
  addEventListener('pointerdown', finishBoot, { once: true });
}
function finishBoot() {
  if (bootDone) return; bootDone = true;
  skipCount?.(); S.intro = 1;
  body.classList.add('go'); body.classList.remove('boot');
  const arc = $('#arc'); if (arc) arc.setAttribute('stroke-dashoffset', 100 - goalNow().progress * 100);
  setTimeout(() => body.classList.remove('go', 'fast'), 2600);
}

/* ---------- большая победа: прыжок ---------- */
function resetTrailView() { buildRet(); renderGoal(); renderColl(); renderMark(); }
function playWin() {
  if (W.on) return;
  if (GL && !glReady) { pendingWin = true; return; }
  finishBoot();
  body.classList.remove('go', 'fast');
  hideTip(); body.classList.remove('coll');
  $('#aT').textContent = MS.win.title; $('#aV').textContent = MS.win.value; $('#aU').textContent = MS.win.valueUsd; $('#aS').textContent = MS.win.sub;
  if (MS.calm) { W.on = false; trail = true; saveTrail(); body.classList.add('w3'); resetTrailView(); addEventListener('click', () => body.classList.remove('w3'), { once: true, capture: true }); GL?.render(); return; }
  Object.assign(W, { on: true, t0: performance.now(), hit2: false, hit3: false });
  scrollTo({ top: 0, behavior: 'instant' });
  body.classList.add('w1');
  MS.sound.rise(1.5);
  const arc = $('#arc'); if (arc) arc.setAttribute('stroke-dashoffset', 0);
  const rev = $('#vRev');
  MS.count(rev, NOW.rev, MS.win.goal.rev, 1400, x => MS.mln(x));
}
function saveTrail() { if (MS.params.has('win')) return; try { sessionStorage.setItem(WIN_KEY, '1'); } catch (e) {} }
function closeWin() {
  if (!W.on || !W.hit3) return;
  W.on = false; trail = true; saveTrail();
  body.classList.remove('w1', 'w2', 'w3');
  $('#vRev').textContent = MS.mln(NOW.rev);
  resetTrailView();
}

/* ---------- запуск ---------- */
renderCenter();
buildRet(); renderGoal(); renderMods(); renderInsight(); renderColl(); fit();
try { GL = initGL(); } catch (e) { body.classList.add('nogl'); }
$('#ins').onclick = () => { MS.nextInsight(); renderInsight(true); MS.sound.click(); };
$('#btnWin').onclick = $('#phWin').onclick = () => MS.playWin();
$('#btnColl').onclick = () => { body.classList.add('coll'); MS.sound.click(); };
$('#kClose').onclick = () => { body.classList.remove('coll'); MS.sound.click(); };
addEventListener('keydown', e => { if (e.key === 'Escape') { body.classList.remove('coll'); closeWin(); } });
$('#after').style.pointerEvents = 'none';
addEventListener('pointerdown', () => { if (W.on && W.hit3) closeWin(); });

let lastW = innerWidth, lastPh = isPhone();
addEventListener('resize', () => {
  const ph = isPhone();
  fit(); GL?.resize();
  if (ph !== lastPh || innerWidth !== lastW) { lastW = innerWidth; lastPh = ph; buildRet(); renderGoal(); renderColl(); }
  if (MS.calm) GL?.render();
});

boot();
MS.ready(playWin);
if (GL) {
  setTimeout(() => GL.warm().then(() => {
    glReady = true;
    startIntro();
    if (pendingWin) { pendingWin = false; playWin(); }
    if (MS.calm) { GL.render(); document.fonts?.ready.then(() => GL.render()); }
    else MS.loop(t => { drum(); GL.step(t); });
  }), 60);
} else if (!MS.calm) MS.loop(drum);
if (MS.calm) addEventListener('scroll', () => { drum(); GL?.render(); }, { passive: true });
</script>
</body>
