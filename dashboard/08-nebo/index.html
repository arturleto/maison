<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Небо. Атлас Maison Sauvage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Forum&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --night:#050a16;--disc:#0b1a36;--gold:#d2ae63;--gold2:#f0dca6;--silver:#cbd2de;--bone:#f1ead9;
  --ink:rgba(241,234,217,.94);--ink2:rgba(241,234,217,.8);--line:rgba(210,174,99,.42);--hair:rgba(210,174,99,.24);
  --R:400px;--col:302px;
}
*{box-sizing:border-box}
html{background:var(--night);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--night);color:var(--ink);font:400 14.5px/1.3 'Old Standard TT',serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(120% 90% at 50% 50%,rgba(18,40,78,.42),transparent 70%),
  repeating-linear-gradient(0deg,rgba(150,178,224,.05) 0 1px,transparent 1px 4px)}
button{all:unset;box-sizing:border-box;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:1px solid var(--gold2);outline-offset:2px}
h1,h2,p{margin:0;font-weight:400}
b,strong{font-weight:400}

.frame{position:fixed;inset:8px;border:1px solid var(--hair);pointer-events:none;z-index:1}
.frame::after{content:"";position:absolute;inset:3px;border:1px solid rgba(210,174,99,.12)}

#app{position:relative;min-height:100dvh;pointer-events:none;z-index:2}
.col{position:absolute;top:20px;bottom:20px;width:var(--col);display:flex;flex-direction:column;gap:11px;pointer-events:auto;z-index:3;transition:opacity .45s}
.col.l{left:20px}.col.r{right:20px}
.col.l{padding-bottom:50px}
.pair{display:grid;grid-template-columns:1fr 1.06fr;gap:14px}

/* Подпись раздела: строчка гравёра */
.lg{font:400 12.5px/1.2 'Forum',serif;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2)}
.sec>.lg{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.sec>.lg::after{content:"";flex:1;height:1px;background:var(--hair)}
.sec>.lg .n{order:2;letter-spacing:.04em;text-transform:none;font:italic 400 13.5px/1 'Old Standard TT',serif;color:var(--ink2)}
.sec>.lg::after{order:1}

/* Картуш: вогнутые углы, двойная гравированная линия */
.cart{position:relative;padding:17px 15px 12px;--q:13px;--c:rgba(210,174,99,.74);
  background:
   radial-gradient(circle at 0 0,transparent calc(var(--q) - .8px),var(--c) calc(var(--q) - .6px),var(--c) calc(var(--q) + .4px),transparent calc(var(--q) + .8px)) 0 0/calc(var(--q) + 1px) calc(var(--q) + 1px) no-repeat,
   radial-gradient(circle at 100% 0,transparent calc(var(--q) - .8px),var(--c) calc(var(--q) - .6px),var(--c) calc(var(--q) + .4px),transparent calc(var(--q) + .8px)) 100% 0/calc(var(--q) + 1px) calc(var(--q) + 1px) no-repeat,
   radial-gradient(circle at 0 100%,transparent calc(var(--q) - .8px),var(--c) calc(var(--q) - .6px),var(--c) calc(var(--q) + .4px),transparent calc(var(--q) + .8px)) 0 100%/calc(var(--q) + 1px) calc(var(--q) + 1px) no-repeat,
   radial-gradient(circle at 100% 100%,transparent calc(var(--q) - .8px),var(--c) calc(var(--q) - .6px),var(--c) calc(var(--q) + .4px),transparent calc(var(--q) + .8px)) 100% 100%/calc(var(--q) + 1px) calc(var(--q) + 1px) no-repeat,
   linear-gradient(var(--c),var(--c)) var(--q) 0/calc(100% - 2*var(--q)) 1px no-repeat,
   linear-gradient(var(--c),var(--c)) var(--q) 100%/calc(100% - 2*var(--q)) 1px no-repeat,
   linear-gradient(var(--c),var(--c)) 0 var(--q)/1px calc(100% - 2*var(--q)) no-repeat,
   linear-gradient(var(--c),var(--c)) 100% var(--q)/1px calc(100% - 2*var(--q)) no-repeat}
.cart::before{content:"";position:absolute;inset:4px;pointer-events:none;border:1px solid rgba(210,174,99,.2);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 11px,100% calc(100% - 11px),calc(100% - 11px) 100%,11px 100%,0 calc(100% - 11px),0 11px)}
.cart>.lg{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);padding:0 10px;background:var(--night);white-space:nowrap}

/* Шапка атласа */
#title{padding:13px 14px 11px;text-align:center}
#title h1{font:400 25px/1 'Forum',serif;letter-spacing:.17em;color:var(--bone);margin-right:-.17em;text-transform:uppercase;white-space:nowrap}
#title .sub{margin-top:5px;font:italic 400 15.5px/1.1 'Cormorant',serif;color:var(--gold2)}
#title .leg{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink2);font-size:13px;font-style:italic}
#title .leg svg{fill:var(--gold2);flex:none}

/* Главное число: в сердце зверя на компьютере */
#hero{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--R)*.56);text-align:center;pointer-events:none;z-index:2;transition:opacity .45s}
.h-cap{font:400 12.5px/1 'Forum',serif;letter-spacing:.17em;text-transform:uppercase;color:var(--gold2)}
.h-num{font:300 calc(var(--R)*.27)/.86 'Cormorant',serif;font-variant-numeric:lining-nums;letter-spacing:-.015em;margin-top:calc(var(--R)*.008);
  background:linear-gradient(178deg,#fff3cf 8%,#e6c67f 52%,#b4893f 92%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em .03em}
.h-unit{font:500 calc(var(--R)*.05)/1.1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone)}
.h-unit i{font-style:normal;color:var(--gold);margin:0 .22em}
.h-day{margin-top:6px;font-size:13.5px;color:var(--ink)}
.h-fc{font-size:13.5px;line-height:1.2;color:var(--ink);font-style:italic}
.lg-p{display:none}
.h-visit{display:none}

/* Цель */
.g-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-name{font:500 25px/1.05 'Cormorant',serif;color:var(--bone)}
.g-val{font-size:14px;color:var(--ink2);white-space:nowrap}
.bar{position:relative;height:9px;margin:8px 7px 7px 0;background:linear-gradient(var(--hair),var(--hair)) 0 50%/100% 1px no-repeat}
.bar i{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:0;border-radius:2px;background:linear-gradient(90deg,#9c7a38,var(--gold2));transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.bar svg{position:absolute;top:50%;right:-8px;margin-top:-8px;width:16px;height:16px;fill:#fff3cf}
.bar::after{content:"";position:absolute;right:-1px;top:0;bottom:0;width:1px;background:var(--gold)}
.g-left{font-size:15px;color:var(--ink)}
.g-left b{font:600 21px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--gold2)}
.g-pct{font:600 21px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--gold2)}
.g-then{margin-top:2px;font-style:italic;font-size:13.5px;color:var(--ink2)}

/* Последний отчёт */
.r-main{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.r-main b{font:500 30px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone);white-space:nowrap}
.r-main span{font-size:14px;color:var(--ink2);white-space:nowrap}
.r-two{display:flex;gap:18px;margin-top:3px;font-size:14.5px}
.r-two b{font:600 19px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--gold2)}
.r-visit{margin-top:4px;font-style:italic;font-size:14px;color:var(--gold2)}
.link{display:block;margin-top:2px;min-height:26px;padding:3px 0;font-size:13.5px;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{color:var(--bone)}

/* Двигатели */
.eng{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:8px;margin-bottom:5px}
.eng .e-l{font-size:14px;color:var(--ink)}
.eng .e-v{font:600 19px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone);white-space:nowrap}
.e-bar{grid-column:1/-1;position:relative;height:7px;margin:2px 7px 1px 0;background:linear-gradient(var(--hair),var(--hair)) 0 50%/100% 1px no-repeat}
.e-bar i{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;border-radius:1px;background:var(--gold)}
.e-bar svg{position:absolute;right:-7px;top:50%;margin-top:-7px;width:14px;height:14px;fill:var(--silver)}
.e-j{grid-column:1/-1;font-size:12.5px;font-style:italic;color:var(--ink2);text-align:right;margin-right:0}
.sec .hint{font-size:12.5px;font-style:italic;color:var(--ink2);line-height:1.2}

/* Лунный календарь */
.moons{display:grid;grid-template-columns:repeat(7,1fr);row-gap:1px}
.moons .wd{font-size:11.5px;color:var(--ink2);text-align:center;font-style:italic}
.moons .m{display:flex;align-items:center;justify-content:center;height:27px;cursor:pointer}
.moons svg{width:23px;height:23px;overflow:visible}
.moons .m:hover svg{transform:scale(1.14)}
.moons .num{font-size:11px;fill:var(--bone)}

/* 13 месяцев */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 11.5px 'Old Standard TT',serif;fill:var(--ink2)}
.chart .hot{fill:var(--bone)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:rgba(210,174,99,.09)}

/* Задачи */
.task{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:center;width:100%;min-height:43px;padding:3px 0;position:relative}
.task+.task{border-top:1px solid rgba(210,174,99,.14)}
.task svg.st{width:21px;height:21px;fill:none;stroke:var(--gold);stroke-width:1;overflow:visible;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.task span{font-size:14.5px;line-height:1.16;color:var(--ink)}
.task em{display:block;font-size:12px;color:var(--ink2)}
.task:hover svg.st{transform:rotate(45deg)}
.task.done svg.st{fill:var(--gold2);stroke:var(--gold2)}
.task.done span{color:var(--ink2)}
.spark{position:absolute;left:12px;top:50%;width:0;height:0;pointer-events:none}
.spark i{position:absolute;left:-1px;top:-1px;width:2px;height:20px;margin-top:-20px;background:linear-gradient(180deg,transparent,var(--gold2));transform-origin:50% 21px;animation:ray .6s ease-out forwards}
@keyframes ray{from{transform:rotate(var(--a)) translateY(8px) scaleY(.2);opacity:1}to{transform:rotate(var(--a)) translateY(-12px) scaleY(1);opacity:0}}

/* Находка */
#ins{display:block;width:100%;min-height:44px;text-align:left}
#ins .t{font:500 18.5px/1.14 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone);transition:opacity .25s}
#ins .more{display:block;margin-top:2px;font-size:12.5px;font-style:italic;color:var(--ink2)}
#ins:hover .more{color:var(--gold2)}

/* Почему, аренда, бренды, инвестор */
.big{font:600 23px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone);white-space:nowrap}
.mid{font-size:13.5px;line-height:1.17;color:var(--ink)}
.why{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:start}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:0}
.dots span{display:flex;justify-content:center;align-items:center;height:12px}
.dots svg{width:10px;height:10px;fill:rgba(203,210,222,.42)}
.dots .on svg{fill:var(--gold2)}
.rent{display:grid;grid-template-columns:1fr 40px;gap:4px;align-items:center}
.inv{display:flex;flex-wrap:wrap;gap:2px 2.2px;margin-top:5px}
.inv i{width:2.5px;height:2.5px;border-radius:50%;background:rgba(203,210,222,.5)}
.top3{margin:0;font-size:13.5px;color:var(--ink);line-height:1.28;text-align:right}
.top3 span{display:block}
.top3 b{color:var(--gold2)}

/* Монеты */
.coins{display:grid;grid-template-columns:repeat(7,1fr);gap:3px 2px;justify-items:center}
.coin{display:block;width:40px;height:40px;position:relative}
.coin svg{width:100%;height:100%;overflow:visible}
.coin text{font:700 11px 'Old Standard TT',serif;text-anchor:middle;dominant-baseline:central}
.coin:hover svg{transform:scale(1.08)}
.coin.new svg{animation:gleam 1.6s ease-out}
@keyframes gleam{0%{filter:brightness(2.2)}100%{filter:none}}

#winBtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:42px;padding:10px;font:400 13.5px/1 'Forum',serif;letter-spacing:.17em;text-transform:uppercase;color:#17110a;background:linear-gradient(180deg,#f0dca6,#c9a458);--q:9px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px)}
#winBtn svg{width:13px;height:13px;fill:#17110a}
#winBtn:hover{filter:brightness(1.09)}

/* Небо */
#sky{position:fixed;inset:0;z-index:1;pointer-events:auto;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#sky.drag{cursor:grabbing}
#sky canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#back{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);display:none;min-height:44px;padding:0 20px;align-items:center;background:rgba(5,10,22,.86);border:1px solid var(--line);font:400 13px/1 'Forum',serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);white-space:nowrap}
body.open #back{display:flex}
body.open .col,body.open #hero{opacity:0;pointer-events:none}
body.open #hero *{pointer-events:none}
#pole{display:none}
#open{display:none}

#tip{position:fixed;left:0;top:0;z-index:9500;max-width:280px;padding:8px 11px 9px;background:#060c1b;border:1px solid var(--line);font-size:14px;line-height:1.22;color:var(--ink);pointer-events:none;opacity:0;transition:opacity .14s;box-shadow:0 8px 28px rgba(0,0,0,.55)}
#tip.on{opacity:1}
#tip b{color:var(--gold2)}

/* Победа */
#win{position:fixed;inset:0;z-index:9000;cursor:pointer;overflow:hidden}
#win[hidden]{display:none}
#win canvas{position:absolute;inset:0;width:100%;height:100%}
#veil{position:absolute;inset:0;background:#030712;opacity:0;transition:opacity 1.3s ease-in}
#wtext{position:absolute;left:0;right:0;bottom:7.5vh;text-align:center;padding:0 22px;opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none}
#wtext.on{opacity:1;transform:none}
.w-name{font:400 13px/1.2 'Forum',serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.w-title{margin-top:7px;font:italic 400 clamp(46px,7.2vh,68px)/1 'Cormorant',serif;color:var(--bone)}
.w-val{margin-top:7px;font:500 clamp(26px,3.8vh,36px)/1.1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--gold2)}
.w-sub{margin-top:6px;font-size:15.5px;color:var(--ink)}
.w-hint{margin-top:12px;font-size:13px;font-style:italic;color:var(--ink2)}

/* Телефон и планшет: одна лента */
@media (max-width:1179px){
  body{font-size:15px}
  body::before{background:repeating-linear-gradient(0deg,rgba(150,178,224,.05) 0 1px,transparent 1px 4px)}
  .frame{display:none}
  #app{display:flex;flex-direction:column;gap:20px;max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));pointer-events:auto}
  .col{display:contents}
  #title{order:1;padding:0;background:none;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:-10px}
  #title::before{display:none}
  #title h1{font-size:17px;letter-spacing:.14em;margin:0}
  #title .sub{margin:0;font-size:15px;white-space:nowrap}
  #title .leg{display:none}
  #hero{order:2;position:static;transform:none;width:auto;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:end;margin-bottom:-6px}
  .h-cap{grid-column:1/-1}
  .h-num{font-size:92px;line-height:.92;margin-top:4px}
  .h-unit{font-size:21px;align-self:end;padding-bottom:9px;line-height:1.08}
  .h-unit i{display:none}
  .h-unit span{display:block;color:var(--gold2)}
  .h-day,.h-fc,.h-visit{grid-column:1/-1}
  .h-day{margin-top:4px;font-size:14.5px}
  .h-fc{font-size:14.5px}
  .lg-d{display:none}.lg-p{display:inline}
  .h-visit{display:block;margin-top:2px;font-size:14.5px;font-style:italic;color:var(--gold2)}
  #goal{order:3}
  #sky{order:4;position:relative;inset:auto;align-self:stretch;width:auto;margin:-6px -14px -4px;aspect-ratio:1/1;touch-action:pan-y;z-index:1;overflow:visible}
  #pole{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:30%}
  #pole b{display:block;font:500 28px/1 'Cormorant',serif;font-variant-numeric:lining-nums;color:var(--bone)}
  #pole span{display:block;font-size:11.5px;line-height:1.1;color:var(--ink2);font-style:italic}
  #open{display:flex;position:absolute;right:2px;bottom:0;align-items:center;min-height:44px;padding:0 8px;font-size:13px;font-style:italic;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  body.open{overflow:hidden}
  body.open #sky{position:fixed;inset:0;width:100%;max-width:none;height:100dvh;aspect-ratio:auto;margin:0;z-index:800;background:var(--night);touch-action:none}
  body.open #pole,body.open #open{display:none}
  body.open #app>*:not(#sky),body.open .col>*{visibility:hidden}
  body.open #sky,body.open #sky *{visibility:visible}
  #ins-sec{order:5}
  #tasks-sec{order:6}
  #report{order:7}
  #eng-sec{order:8}
  #why-sec{order:9}
  #moons-sec{order:10}
  #months-sec{order:11}
  #pair-b{order:12;display:contents}
  #brands-sec{order:12}
  #rent-sec{order:13}
  #inv-sec{order:14}
  #coins-sec{order:15}
  #winBtn{order:16;min-height:50px}
  .moons .m{height:44px}
  .moons svg{width:34px;height:34px}
  .coins{gap:8px 4px}
  .coin{width:46px;height:46px}
  .coins{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .inv i{width:3px;height:3px}
  .why{grid-template-columns:1fr 140px}
  .dots span{height:17px}
  .dots svg{width:13px;height:13px}
  .big{font-size:30px}
  .mid,.top3{font-size:14.5px}
  .g-name{font-size:27px}
  #ins .t{font-size:21px}
  .chart text{font-size:11.5px}
  #wtext{bottom:calc(76px + env(safe-area-inset-bottom))}
  #back{top:calc(10px + env(safe-area-inset-top))}
}
@media (min-width:1180px) and (max-height:860px){
  .col{gap:7px}.moons .m{height:23px}.moons svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="s4" viewBox="-10 -10 20 20"><path d="M0-10C.8-3 3-.8 10 0 3 .8.8 3 0 10-.8 3-3 .8-10 0-3-.8-.8-3 0-10z"/></symbol>
  <symbol id="s8" viewBox="-10 -10 20 20"><path d="M0-10 1.3-3.2 6-6 3.2-1.3 10 0 3.2 1.3 6 6 1.3 3.2 0 10-1.3 3.2-6 6-3.2 1.3-10 0-3.2-1.3-6-6-1.3-3.2z"/></symbol>
</defs></svg>
<div class="frame" aria-hidden="true"></div>

<main id="app">
  <div class="col l">
    <header id="title" class="cart">
      <h1>Maison Sauvage</h1>
      <p class="sub">Атлас неба. Умалас, Бали</p>
      <p class="leg" id="leg"></p>
    </header>

    <section id="hero" aria-label="Выручка месяца">
      <p class="h-cap">Выручка месяца</p>

  both([[.126, .140], [.134, .170], [.160, .172], [.170, .140]], featLine);
  both([[.208, .030], [.184, -.006], [.186, -.052]], featLine);
  [[.094, -.078, .300, -.048], [.104, -.094, .316, -.106], [.100, -.110, .296, -.168]].forEach(w => both([[w[0], w[1]], [(w[0] + w[2]) / 2, (w[1] + w[3]) / 2 + .018], [w[2], w[3]]], featWhisk));
  [nearFore, nearHind, farFore, farHind].forEach(l => {
