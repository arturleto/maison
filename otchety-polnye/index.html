<style>
:root { --bg:#f7f6f3; --card:#fff; --ink:#26221f; --muted:#746e67; --line:rgba(38,34,31,.14); --accent:#a3141e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1c1917; --card:#2b2724; --ink:#ede8e1; --muted:#a59d93; --line:rgba(237,232,225,.16); --accent:#e2626a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg:#1c1917; --card:#2b2724; --ink:#ede8e1; --muted:#a59d93; --line:rgba(237,232,225,.16); --accent:#e2626a; color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 400 16px/1.55 "Manrope", system-ui, sans-serif; }
.box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 30px 28px 26px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font: 400 30px/1.15 "Prata", Georgia, serif; margin: 8px 0 10px; }
p { margin: 0 0 18px; color: var(--muted); }
input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
button { margin-top: 12px; width: 100%; font: 700 14px "Manrope", system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; padding: 13px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--accent); font-size: 14px; margin-top: 10px; min-height: 20px; }
a { color: inherit; }
</style>
</head>

</form>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: u8(SALT), iterations: 300000, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: u8(IV)}, key, u8(CT));
  return new TextDecoder().decode(pt);
}
async function go(pw, silent) {
  const b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; e.textContent = "";
  try {
    const html = await unlock(pw);
    try { sessionStorage.setItem("ms_otchety_pw", pw); } catch (x) {}
    document.open(); document.write(html); document.close();
  } catch (x) {
    b.disabled = false;
    if (!silent) e.textContent = "Пароль не подошёл.";
  }
}
document.getElementById("f").addEventListener("submit", ev => { ev.preventDefault(); go(document.getElementById("pw").value.trim(), false); });
